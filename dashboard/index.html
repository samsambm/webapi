<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spending, price trends and store-by-store comparison built from scanned receipts.">
<style>
  :root { color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<title>Basket Watch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground:#f3f4f1; --surface:#ffffff; --surface-2:#fafbf9;
    --ink:#12151a; --ink-2:#46505a; --muted:#6b7580;
    --hairline:#e3e6e0; --hairline-2:#eef0ec;
    --accent:#2a78d6; --accent-soft:#e8f0fc;
    --good:#008300; --bad:#c2352f; --flag:#9a6700; --flag-soft:#fdf4e0;
    --store-1:#2a78d6; --store-2:#eb6834; --store-3:#1baf7a;
    --demo-band:#f6efdd;
    --shadow:0 1px 2px rgba(18,21,26,.05), 0 8px 24px -16px rgba(18,21,26,.25);
    --radius:10px;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"Heebo", ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#131619; --surface:#1a1e22; --surface-2:#1e2327;
      --ink:#f0f2ee; --ink-2:#c3c9cf; --muted:#97a1aa;
      --hairline:#2a3036; --hairline-2:#22272c;
      --accent:#3987e5; --accent-soft:#17293f;
      --good:#3fa34d; --bad:#e66767; --flag:#e0b155; --flag-soft:#2c2415;
      --store-1:#3987e5; --store-2:#d95926; --store-3:#199e70;
      --demo-band:#2a2417;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --ground:#131619; --surface:#1a1e22; --surface-2:#1e2327;
    --ink:#f0f2ee; --ink-2:#c3c9cf; --muted:#97a1aa;
    --hairline:#2a3036; --hairline-2:#22272c;
    --accent:#3987e5; --accent-soft:#17293f;
    --good:#3fa34d; --bad:#e66767; --flag:#e0b155; --flag-soft:#2c2415;
    --store-1:#3987e5; --store-2:#d95926; --store-3:#199e70;
    --demo-band:#2a2417;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
         font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding-inline:16px; }
  h1,h2,h3 { margin:0; text-wrap:balance; }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  .topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
            background:color-mix(in srgb, var(--ground) 92%, transparent);
            backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline); }
  .topbar-inner { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding-block:11px; }
  .brand { display:flex; align-items:baseline; gap:10px; margin-inline-end:auto; }
  .brand h1 { font-size:19px; font-weight:800; letter-spacing:-.02em; }
  .brand .tick { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  select, input[type="search"], input[type="text"], input[type="number"], textarea {
    font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
    border:1px solid var(--hairline); border-radius:7px; padding:6px 9px; min-width:0; }
  input[type="search"] { width:180px; }
  select:focus-visible, input:focus-visible, button:focus-visible, textarea:focus-visible, th[role="button"]:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }
  .switch { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); cursor:pointer; }
  .switch input { accent-color:var(--accent); width:15px; height:15px; }
  button { font:inherit; cursor:pointer; }
  .btn { font-size:13px; font-weight:600; border-radius:7px; padding:7px 13px;
         border:1px solid var(--hairline); background:var(--surface); color:var(--ink); }
  .btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.08); color:#fff; }

  .seg { display:inline-flex; border:1px solid var(--hairline); border-radius:7px; overflow:hidden; background:var(--surface); }
  .seg button { border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; padding:6px 11px; }
  .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); }

  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--hairline); margin-bottom:0; }
  .tabs button { border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:600;
                 padding:11px 15px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .tabs button:hover { color:var(--ink); }

  .demo-band { background:var(--demo-band); border-bottom:1px solid var(--hairline); font-size:12.5px; color:var(--ink-2); }
  .demo-band .wrap { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; padding-block:7px; }
  .pill { font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
          background:var(--flag-soft); color:var(--flag);
          border:1px solid color-mix(in srgb, var(--flag) 35%, transparent);
          border-radius:999px; padding:2px 8px; white-space:nowrap; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px;
          background:var(--hairline); border:1px solid var(--hairline); border-radius:var(--radius);
          overflow:hidden; margin-block:22px; }
  .kpi { background:var(--surface); padding:15px 16px 16px; }
  .kpi .k-label { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .kpi .k-value { font-family:var(--mono); font-size:25px; font-weight:600; letter-spacing:-.03em; margin-top:6px; }
  .kpi .k-note { font-size:12px; color:var(--muted); margin-top:3px; }
  .kpi.flagged .k-value { color:var(--bad); }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:16px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .card + .card, .grid + .card, .card + .grid, .grid + .grid { margin-top:16px; }
  .card-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:4px; }
  .card h2 { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .card .sub { font-size:12.5px; color:var(--muted); margin-bottom:14px; margin-top:0; }
  .card .hint { font-size:12px; color:var(--muted); font-weight:500; }
  .chart { width:100%; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .empty { border:1px dashed var(--hairline); border-radius:8px; padding:22px 18px; color:var(--muted);
           font-size:13.5px; text-align:center; background:var(--surface-2); }
  .empty strong { color:var(--ink-2); font-weight:600; }

  .scroll { overflow-x:auto; margin-inline:-4px; padding-inline:4px; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:start; padding:8px 10px; border-bottom:1px solid var(--hairline-2); white-space:nowrap; }
  th { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600;
       border-bottom:1px solid var(--hairline); position:sticky; top:0; background:var(--surface); }
  th[role="button"] { cursor:pointer; user-select:none; }
  th[role="button"]:hover { color:var(--ink); }
  td.n, th.n { text-align:end; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  tbody tr:hover { background:var(--surface-2); }
  td.name { white-space:normal; min-width:190px; max-width:320px; }
  .sec { font-size:12px; color:var(--muted); }
  .best { color:var(--good); font-weight:600; }
  .best::after { content:" ✓"; }
  .delta-up { color:var(--bad); font-weight:600; }
  .delta-down { color:var(--good); font-weight:600; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); }
  .dot { width:9px; height:9px; border-radius:2px; flex:none; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; }
  .flagrow td { background:color-mix(in srgb, var(--flag-soft) 60%, transparent); }
  .tag { font-size:10.5px; font-family:var(--mono); color:var(--muted); }

  /* scan */
  .drop { border:2px dashed var(--hairline); border-radius:var(--radius); background:var(--surface-2);
          padding:34px 20px; text-align:center; transition:border-color .12s, background .12s; }
  .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop h3 { font-size:16px; margin-bottom:6px; }
  .drop p { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .preview { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .preview img { max-height:280px; border-radius:8px; border:1px solid var(--hairline); }
  .status { display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-2); }
  .spinner { width:14px; height:14px; border:2px solid var(--hairline); border-top-color:var(--accent);
             border-radius:50%; animation:spin .7s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .notice { border-radius:8px; padding:11px 13px; font-size:13px; margin-block:12px; border:1px solid; }
  .notice-warn { background:var(--flag-soft); border-color:color-mix(in srgb,var(--flag) 35%,transparent); color:var(--flag); }
  .notice-bad { background:color-mix(in srgb,var(--bad) 10%,transparent); border-color:color-mix(in srgb,var(--bad) 35%,transparent); color:var(--bad); }
  .notice-good { background:color-mix(in srgb,var(--good) 10%,transparent); border-color:color-mix(in srgb,var(--good) 35%,transparent); color:var(--good); }
  .row-actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:14px; align-items:center; }

  /* ask */
  .ask-thread { display:flex; flex-direction:column; gap:14px; margin-bottom:16px; }
  .bubble { border-radius:10px; padding:12px 14px; font-size:14px; max-width:min(680px,100%); white-space:pre-wrap; }
  .bubble.me { background:var(--accent-soft); color:var(--ink); align-self:flex-end; border:1px solid color-mix(in srgb,var(--accent) 25%,transparent); }
  .bubble.ai { background:var(--surface-2); border:1px solid var(--hairline); align-self:flex-start; }
  .bubble .who { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:5px; }
  .ask-form { display:flex; gap:9px; align-items:flex-end; }
  .ask-form textarea { flex:1; resize:vertical; min-height:46px; font-size:14px; }
  .suggest { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .suggest button { font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
                    border:1px solid var(--hairline); border-radius:999px; padding:5px 11px; }
  .suggest button:hover { border-color:var(--accent); color:var(--accent); }

  #tip { position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .09s;
         background:var(--surface); color:var(--ink); border:1px solid var(--hairline); border-radius:7px;
         padding:8px 10px; font-size:12.5px; box-shadow:var(--shadow); max-width:260px; }
  #tip .t-title { font-weight:700; margin-bottom:3px; }
  #tip .t-row { color:var(--ink-2); font-family:var(--mono); font-size:12px; }
  .mark { transition:opacity .1s; }
  .mark:hover { opacity:.82; }

  footer { color:var(--muted); font-size:12.5px; padding-block:30px 40px; }
  footer code { font-family:var(--mono); font-size:11.5px; color:var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { *, .spinner { animation:none !important; transition:none !important; } }
  @media (max-width:560px) {
    .brand h1 { font-size:17px; }
    input[type="search"] { width:100%; }
    .controls { width:100%; }
    .kpi .k-value { font-size:21px; }
    .tabs button { padding:10px 11px; font-size:13px; }
  }
</style>

<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand"><h1 id="brand-name">Basket Watch</h1><span class="tick" id="range-tick"></span></div>
    <div class="controls">
      <span class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-he" aria-pressed="false">עברית</button>
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
      </span>
      <select id="f-currency" aria-label="Currency"></select>
      <input type="number" id="f-rate" step="0.0001" min="0" style="width:96px" hidden>
    </div>
  </div>
  <div class="wrap"><div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-dash" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-scan" aria-selected="false"></button>
    <button type="button" role="tab" id="tab-ask" aria-selected="false"></button>
  </div></div>
</div>
<div class="demo-band" id="demo-band" hidden>
  <div class="wrap"><span class="pill" id="demo-pill"></span><span id="demo-band-text"></span></div>
</div>

<main class="wrap">
  <!-- ============ dashboard ============ -->
  <section id="view-dash">
    <div class="controls" style="padding-block:16px 0; gap:8px">
      <label class="switch" for="f-demo"><input type="checkbox" id="f-demo" checked> <span id="f-demo-label"></span></label>
      <select id="f-period" aria-label="Period"></select>
      <select id="f-store" aria-label="Store"></select>
      <select id="f-cat" aria-label="Category"></select>
      <input type="search" id="f-q" aria-label="Search">
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <section class="card">
        <div class="card-head"><h2 id="h-months"></h2><span class="hint" id="spend-hint"></span></div>
        <p class="sub" id="s-months"></p><div class="chart" id="c-months"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 id="h-cats"></h2><span class="hint" id="cat-hint"></span></div>
        <p class="sub" id="s-cats"></p><div class="chart" id="c-cats"></div>
      </section>
    </div>
    <div class="grid">
      <section class="card">
        <div class="card-head"><h2 id="h-index"></h2><span class="hint" id="hint-index"></span></div>
        <p class="sub" id="s-index"></p><div class="chart" id="c-index"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 id="h-stores"></h2><span class="hint" id="hint-stores"></span></div>
        <p class="sub" id="s-stores"></p><div class="chart" id="c-stores"></div>
      </section>
    </div>
    <section class="card">
      <div class="card-head"><h2 id="h-compare"></h2><span class="hint" id="cmp-hint"></span></div>
      <p class="sub" id="s-compare"></p><div id="t-compare"></div>
    </section>
    <div class="grid">
      <section class="card">
        <div class="card-head"><h2 id="h-movers"></h2><span class="hint" id="hint-movers"></span></div>
        <p class="sub" id="s-movers"></p><div id="t-movers"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 id="h-receipts"></h2><span class="hint" id="rec-hint"></span></div>
        <p class="sub" id="s-receipts"></p><div id="t-receipts"></div>
      </section>
    </div>
    <section class="card">
      <div class="card-head"><h2 id="h-lines"></h2><span class="hint" id="lines-hint"></span></div>
      <p class="sub" id="s-lines"></p><div id="t-lines"></div>
    </section>
  </section>

  <!-- ============ scan ============ -->
  <section id="view-scan" hidden>
    <section class="card" style="margin-top:22px">
      <div class="card-head"><h2 id="h-scan"></h2></div>
      <p class="sub" id="s-scan"></p>
      <div id="scan-unavailable" class="empty" hidden></div>
      <div id="scan-ui" hidden>
        <div class="drop" id="drop">
          <h3 id="drop-title"></h3>
          <p id="drop-sub"></p>
          <input type="file" id="file" accept="image/*" hidden>
          <button type="button" class="btn btn-primary" id="pick"></button>
        </div>
        <div id="scan-stage" hidden style="margin-top:16px">
          <div class="preview">
            <img id="scan-img" alt="">
            <div style="flex:1; min-width:240px">
              <div class="status" id="scan-status"></div>
              <div id="scan-result"></div>
              <div class="row-actions" id="scan-actions"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><h2 id="h-saved"></h2><span class="hint" id="saved-hint"></span></div>
      <p class="sub" id="s-saved"></p><div id="t-saved"></div>
    </section>
  </section>

  <!-- ============ ask ============ -->
  <section id="view-ask" hidden>
    <section class="card" style="margin-top:22px">
      <div class="card-head"><h2 id="h-ask"></h2></div>
      <p class="sub" id="s-ask"></p>
      <div id="ask-unavailable" class="empty" hidden></div>
      <div id="ask-ui" hidden>
        <div class="suggest" id="ask-suggest"></div>
        <div class="ask-thread" id="ask-thread"></div>
        <form class="ask-form" id="ask-form">
          <textarea id="ask-input" rows="2"></textarea>
          <button type="submit" class="btn btn-primary" id="ask-send"></button>
          <button type="button" class="btn" id="ask-stop" hidden></button>
        </form>
        <p class="sec" id="ask-note" style="margin-top:10px"></p>
      </div>
    </section>
  </section>

  <footer><span id="foot-text"></span> <span id="built"></span></footer>
</main>
<div id="tip" role="status" aria-live="polite"></div>

  const TO_BASE = { g: ["kg", 0.001], kg: ["kg", 1], ml: ["l", 0.001], l: ["l", 1] };
  const slug = (s) => String(s || "").trim().toLowerCase().replace(/[^\w֐-׿]+/g, "-").replace(/^-+|-+$/g, "") || "unknown";

  /** Same arithmetic the Python validator enforces, so a scan is checked before it is saved. */
  function checkReceipt(r) {
    const problems = [];
    const items = r.items || [];
    if (!items.length) problems.push("no items");
    items.forEach((i) => {
      const expect = Math.round((Number(i.quantity) || 0) * (Number(i.unit_price) || 0) * 100) / 100;
      if (Math.abs(expect - (Number(i.total) || 0)) > 0.02) {

  /* ======================= the working set ======================= */

  const STORE_SLOTS = {};

  /* ======================= filtering ======================= */

      (state.cat === "all" || r.category === state.cat) &&

  /* ======================= price intelligence ======================= */
  function priceBook(rows) {
    const book = new Map();
    rows.forEach((r) => {
      if (!book.has(r.product_key)) {
        book.set(r.product_key, { key: r.product_key, name: r.name, name_en: r.name_en, unit: r.base_unit, category: r.category, stores: new Map(), history: [] });
      }
      const p = book.get(r.product_key);
      p.history.push(r);
      const prev = p.stores.get(r.merchant_slug);
      if (!prev || r.date > prev.date) p.stores.set(r.merchant_slug, { date: r.date, price: r.base_price });
    });
    book.forEach((p) => p.history.sort((a, b) => a.date.localeCompare(b.date)));

  }
  function overpay(rows, book) {
    let lost = 0;
    const per = new Map();
    rows.forEach((r) => {
      const p = book.get(r.product_key);
      if (!p || p.stores.size < 2) return;
      let best = null;
      p.stores.forEach((v, slug) => { if (!best || v.price < best.price) best = { price: v.price, slug }; });
      if (!best || best.slug === r.merchant_slug) return;
      const diff = (r.base_price - best.price) * r.base_qty;
      if (diff <= 0.01) return;
      lost += diff;

    });

  }
  // Matched-model index: every price is compared with the FIRST price of the same
  // product at the same store, so a pricier store entering the data never reads as inflation.
  function basketIndex(rows) {
    const months = [...new Set(rows.map((r) => r.month))].sort();
    if (months.length < 2) return [];
    const tracked = [];
    groupBy(rows, (r) => r.product_key + "@" + r.merchant_slug).forEach((rs) => {
      const sorted = [...rs].sort((a, b) => a.date.localeCompare(b.date));
      const byMonth = new Map();
      sorted.forEach((r) => byMonth.set(r.month, r.base_price));
      if (byMonth.size < 2 || !sorted[0].base_price) return;
      tracked.push({ byMonth, base: sorted[0].base_price, weight: sum(sorted, (r) => r.total) / sorted.length });
    });
    if (!tracked.length) return [];
    const raw = [];
    months.forEach((m) => {
      let num = 0, den = 0, fresh = 0;
      tracked.forEach((tr) => {
        let rel = null, seen = false;
        tr.byMonth.forEach((price, mm) => { if (mm <= m) { rel = price / tr.base; if (mm === m) seen = true; } });
        if (rel === null) return;
        num += rel * tr.weight; den += tr.weight; if (seen) fresh += 1;
      });
      if (den) raw.push({ month: m, value: num / den, covered: fresh, total: tracked.length });
    });

    book.forEach((p) => { if (p.stores.size >= 2) shared.push(p); });
    if (!shared.length) return [];
    return stores.map((slug) => {
      let cost = 0, ref = 0, n = 0;
      shared.forEach((p) => {
        const here = p.stores.get(slug);
        if (!here) return;
        let best = Infinity;
        p.stores.forEach((v) => { best = Math.min(best, v.price); });
        cost += here.price; ref += best; n += 1;
      });
      return { slug, name: storeName(slug), n, value: ref ? (cost / ref) * 100 : null };

  /* ======================= dashboard ======================= */

      '</div><div class="k-value">' + esc(value) + '</div><div class="k-note">' + esc(note) + "</div></div>";

  function renderDash() {
    const rows = visibleRows(), receipts = visibleReceipts(rows), book = priceBook(rows);
    const spend = sum(rows, (r) => r.total), over = overpay(rows, book);

    $("range-tick").textContent = receipts.length ? receipts[receipts.length - 1].date + " → " + receipts[0].date : t("no_receipts");

    $("kpis").innerHTML = [
      kpi(t("kpi_total"), money(spend), t("kpi_total_note", { n: receipts.length, l: rows.length })),
      kpi(t("kpi_avg"), money(receipts.length ? spend / receipts.length : 0), t("kpi_avg_note", { n: new Set(receipts.map((r) => r.merchant_slug)).size })),
      kpi(t("kpi_over"), money(over.lost), tracked ? t("kpi_over_note", { n: tracked }) : t("kpi_over_none"), over.lost > 0.5),
      kpi(t("kpi_vat"), money(vat), t("kpi_vat_note")),
      kpi(t("kpi_max"), maxLine ? money(maxLine.total) : "—", maxLine ? (state.lang === "he" ? maxLine.name : (maxLine.name_en || maxLine.name)) + " · " + maxLine.merchant_name : "—"),
    ].join("");

    const byMonth = [...groupBy(rows, (r) => r.month).entries()].sort((a, b) => a[0].localeCompare(b[0]));
    if (!byMonth.length) { emptyState($("c-months"), t("e_range_t"), t("e_range_d")); $("spend-hint").textContent = ""; }
    else {
      $("spend-hint").textContent = t("months_n", { n: byMonth.length });
      columnChart($("c-months"), byMonth.map(([m, rs]) => {
        const v = sum(rs, (r) => r.total);
        return { label: monthLabel(m), value: v, valueLabel: money0(v),
          tip: "<div class='t-title'>" + monthLabel(m) + "</div><div class='t-row'>" +
               esc(t("receipts_lines", { v: money(v), r: new Set(rs.map((r) => r.receipt_id)).size, l: rs.length })) + "</div>" };
      }), t("h_months"));
    }

    // One accent hue: the axis labels carry identity, so no colour cycling over 15 categories.
    const cats = [...groupBy(rows, (r) => r.category).entries()]
      .map(([c, rs]) => ({ c, v: sum(rs, (x) => x.total), n: rs.length })).sort((a, b) => b.v - a.v);
    if (!cats.length) { emptyState($("c-cats"), t("e_range_t"), t("e_range_d")); $("cat-hint").textContent = ""; }
    else {
      const top = cats.slice(0, 7), rest = cats.slice(7);
      if (rest.length) top.push({ c: "__other", v: sum(rest, (x) => x.v), n: sum(rest, (x) => x.n) });
      $("cat-hint").textContent = t("cats_n", { n: cats.length });
      barChart($("c-cats"), top.map((d) => ({
        label: d.c === "__other" ? t("other_cats", { n: rest.length }) : catLabel(d.c),
        value: d.v, valueLabel: money0(d.v),
        tip: "<div class='t-title'>" + esc(d.c === "__other" ? t("other_cats_t") : catLabel(d.c)) + "</div><div class='t-row'>" +
             money(d.v) + " · " + (spend ? ((d.v / spend) * 100).toFixed(1) : 0) + "% · " + d.n + "</div>",
      })), t("h_cats"));
    }

    const idx = basketIndex(rows);
    if (idx.length < 2) emptyState($("c-index"), t("e_hist_t"), t("e_hist_d"));
    else {
      lineChart($("c-index"), idx.map((p) => ({
        label: monthLabel(p.month), value: p.value,
        tip: "<div class='t-title'>" + monthLabel(p.month) + "</div><div class='t-row'>" +
             esc(t("idx_vs", { v: p.value.toFixed(1), d: (p.value >= 100 ? "+" : "") + (p.value - 100).toFixed(1), m: monthLabel(idx[0].month) })) +
             "</div><div class='t-row'>" + esc(t("idx_covered", { c: p.covered, t: p.total })) + "</div>",
      })), t("h_index"));
    }

    const levels = storeLevels(rows, book);
    if (!levels.length) emptyState($("c-stores"), t("e_stores_t"), t("e_stores_d"));
    else {
      barChart($("c-stores"), levels.map((s) => ({
        label: s.name, value: s.value, valueLabel: s.value.toFixed(1), color: storeColor(s.slug),
        tip: "<div class='t-title'>" + esc(s.name) + "</div><div class='t-row'>" + esc(t("vs_cheapest", { v: s.value.toFixed(1) })) +
             "</div><div class='t-row'>" + esc(t("on_shared", { n: s.n })) + "</div>",
      })), t("h_stores"));
      $("c-stores").insertAdjacentHTML("beforeend", '<div class="legend">' + levels.map((s) =>
        '<span class="chip"><span class="dot" style="background:' + storeColor(s.slug) + '"></span>' + esc(s.name) + "</span>").join("") + "</div>");
    }

    renderCompare(book, over.per);
    renderMovers(rows);
    renderReceipts(receipts);
    renderLines(rows);
  }

  function renderCompare(book, perProduct) {
    const el = $("t-compare");
    const shared = [...book.values()].filter((p) => p.stores.size >= 2);
    $("cmp-hint").textContent = shared.length ? t("products_n", { n: shared.length }) : "";
    if (!shared.length) { emptyState(el, t("e_overlap_t"), t("e_overlap_d")); return; }
    const stores = [...new Set([].concat(...shared.map((p) => [...p.stores.keys()])))].sort();
    shared.sort((a, b) => (perProduct.get(b.key) || 0) - (perProduct.get(a.key) || 0) || spreadOf(b) - spreadOf(a));
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_product")) + "</th>" +
      stores.map((s) => '<th class="n"><span class="chip"><span class="dot" style="background:' + storeColor(s) + '"></span>' + esc(storeName(s)) + "</span></th>").join("") +
      '<th class="n">' + esc(t("col_spread")) + '</th><th class="n">' + esc(t("col_costing")) + "</th></tr></thead><tbody>";
    shared.slice(0, 18).forEach((p) => {
      let best = Infinity, worst = 0;
      p.stores.forEach((v) => { best = Math.min(best, v.price); worst = Math.max(worst, v.price); });
      const second = state.lang === "he" ? p.name_en : "";
      h += "<tr><td class='name'><span dir='auto'>" + esc(state.lang === "he" ? p.name : (p.name_en || p.name)) + "</span>" +
        (state.lang === "he" ? "" : "<br><span class='sec' dir='auto'>" + esc(p.name) + "</span>") +
        (second ? "<br><span class='sec'>" + esc(second) + "</span>" : "") + "</td>";
      stores.forEach((s) => {
        const v = p.stores.get(s);
        h += '<td class="n">' + (v ? '<span class="' + (v.price === best ? "best" : "") + '">' + money(v.price) + baseUnit(p.unit) + "</span>" : '<span class="sec">—</span>') + "</td>";
      });
      h += '<td class="n">' + (best ? "+" + (((worst - best) / best) * 100).toFixed(0) + "%" : "—") + "</td>";
      const lost = perProduct.get(p.key) || 0;
      h += '<td class="n">' + (lost > 0.01 ? '<span class="delta-up">' + money(lost) + "</span>" : '<span class="sec">—</span>') + "</td></tr>";
    });
    el.innerHTML = h + "</tbody></table></div>";
  }

  function renderMovers(rows) {
    const el = $("t-movers"), movers = [];
    groupBy(rows, (r) => r.product_key + "@" + r.merchant_slug).forEach((rs) => {
      const sorted = [...rs].sort((a, b) => a.date.localeCompare(b.date));
      const first = sorted[0], last = sorted[sorted.length - 1];
      if (first.date === last.date || !first.base_price) return;
      const change = ((last.base_price - first.base_price) / first.base_price) * 100;
      if (Math.abs(change) >= 0.5) movers.push({ first, last, change });
    });
    if (!movers.length) { emptyState(el, t("e_repeat_t"), t("e_repeat_d")); return; }
    movers.sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_product")) + '</th><th class="n">' + esc(t("col_first")) +
      '</th><th class="n">' + esc(t("col_latest")) + '</th><th class="n">' + esc(t("col_change")) + "</th></tr></thead><tbody>";
    movers.slice(0, 10).forEach((m) => {
      const up = m.change > 0, u = baseUnit(m.first.base_unit);
      h += "<tr><td class='name'><span dir='auto'>" + esc(state.lang === "he" ? m.first.name : (m.first.name_en || m.first.name)) + "</span><br><span class='sec'>" +
        "<span class='dot' style='display:inline-block;background:" + storeColor(m.first.merchant_slug) + "'></span> " +
        "<span dir='auto'>" + esc(m.first.merchant_name) + "</span> · " + esc(m.first.date) + " → " + esc(m.last.date) + "</span></td>" +
        '<td class="n">' + money(m.first.base_price) + u + '</td><td class="n">' + money(m.last.base_price) + u + "</td>" +
        '<td class="n ' + (up ? "delta-up" : "delta-down") + '">' + (up ? "▲" : "▼") + " " + pct(m.change) + "</td></tr>";
    });
    el.innerHTML = h + "</tbody></table></div>";
  }

  function renderReceipts(receipts) {
    const el = $("t-receipts");
    $("rec-hint").textContent = t("in_view", { n: receipts.length });
    if (!receipts.length) { emptyState(el, t("e_norec_t"), t("e_norec_d")); return; }
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_date")) + "</th><th>" + esc(t("col_store")) +
      '</th><th class="n">' + esc(t("col_items")) + '</th><th class="n">' + esc(t("col_total")) + "</th></tr></thead><tbody>";

        "<td><span class='chip'><span class='dot' style='background:" + storeColor(r.merchant_slug) + "'></span><span dir='auto'>" + esc(r.merchant_name) + "</span></span></td>" +
        '<td class="n">' + r.items_count + '</td><td class="n">' + money(r.total) + "</td></tr>";

  const LINE_COLS = [
    { key: "date", label: "col_date" }, { key: "name", label: "col_item" },
    { key: "merchant_name", label: "col_store" }, { key: "category", label: "col_category" },
    { key: "quantity", label: "col_qty", n: true }, { key: "unit_price", label: "col_unit_price", n: true },
    { key: "base_price", label: "col_base", n: true }, { key: "total", label: "col_paid", n: true },
  ];
  function renderLines(rows) {
    const el = $("t-lines");
    $("lines-hint").textContent = t("lines_n", { n: rows.length });
    if (!rows.length) { emptyState(el, t("e_lines_t"), t("e_lines_d")); return; }
    const { key, dir } = state.sortLines;
    const sorted = [...rows].sort((a, b) => {
      const x = a[key], y = b[key];
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), state.lang)) * dir;
    });
    let h = '<div class="scroll"><table><thead><tr>' + LINE_COLS.map((c) =>
      '<th role="button" tabindex="0" data-key="' + c.key + '" class="' + (c.n ? "n" : "") + '">' + esc(t(c.label)) +
      (key === c.key ? (dir === 1 ? " ▲" : " ▼") : "") + "</th>").join("") + "</tr></thead><tbody>";
    sorted.slice(0, 250).forEach((r) => {
      const flagged = r.confidence != null && r.confidence < 0.8;
      const primary = state.lang === "he" ? r.name : (r.name_en || r.name);
      const secondary = state.lang === "he" ? (r.name_en || "") : (r.name !== primary ? r.name : "");
      h += '<tr class="' + (flagged ? "flagrow" : "") + '">' +
        "<td>" + esc(r.date) + (r.demo ? ' <span class="tag">demo</span>' : "") + "</td>" +
        "<td class='name'><span dir='auto'>" + esc(primary) + "</span>" +
        (secondary ? "<br><span class='sec' dir='auto'>" + esc(secondary) + "</span>" : "") +
        (flagged ? '<br><span class="sec">' + esc(t("low_conf")) + "</span>" : "") + "</td>" +
        "<td><span class='chip'><span class='dot' style='background:" + storeColor(r.merchant_slug) + "'></span><span dir='auto'>" + esc(r.merchant_name) + "</span></span></td>" +
        "<td class='sec'>" + esc(catLabel(r.category)) + "</td>" +
        '<td class="n">' + r.quantity + (r.unit === "kg" ? " kg" : "") + '</td>' +
        '<td class="n">' + money(r.unit_price) + '</td>' +
        '<td class="n">' + money(r.base_price) + baseUnit(r.base_unit) + '</td>' +
        '<td class="n">' + money(r.total) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    if (sorted.length > 250) h += '<p class="sec" style="margin-top:10px">' + esc(t("showing_first", { n: sorted.length })) + "</p>";
    el.innerHTML = h;
    el.querySelectorAll("th[role=button]").forEach((th) => {
      const go = () => {
        const k = th.dataset.key;
        state.sortLines = { key: k, dir: state.sortLines.key === k ? -state.sortLines.dir : -1 };
        renderLines(rows);
      };
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }

  /* ======================= capabilities ======================= */
  const CAP = { sample: null, db: null, assets: null, downloads: null, images: null, tools: null, ready: false };

  async function initCaps() {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") { CAP.ready = true; paintCapStates(); return; }
    const [sample, db, assets, downloads] = await Promise.all([
      claude.use("sample").catch(() => null), claude.use("db").catch(() => null),
      claude.use("assets").catch(() => null), claude.use("downloads").catch(() => null),
    ]);
    CAP.sample = sample; CAP.db = db; CAP.assets = assets; CAP.downloads = downloads;
    if (sample) {
      const lim = await sample.limits().catch(() => null);
      CAP.images = (lim && lim.images) || null;
      CAP.tools = (lim && lim.tools) || null;
    }
    if (db) subscribeReceipts();
    CAP.ready = true;
    paintCapStates();
  }
  function subscribeReceipts() {                      // subscribe once, never from render
    CAP.db.collection("receipts").onSnapshot(
      (snap) => {
        scanned = snap.docs.map((d) => d.data()).filter((r) => r && r.items && r.receipt_id);
        assignStoreColours();
        renderCurrent();
      },
      () => { /* terminal db error: the page keeps working on built-in data */ },
    );
  }
  function paintCapStates() {
    const canScan = !!(CAP.sample && CAP.images);
    $("scan-ui").hidden = !canScan;
    $("scan-unavailable").hidden = canScan;
    if (!canScan) $("scan-unavailable").innerHTML = "<strong>" + esc(t("h_scan")) + "</strong><br>" + esc(t("scan_unavailable"));
    const canAsk = !!CAP.sample;
    $("ask-ui").hidden = !canAsk;
    $("ask-unavailable").hidden = canAsk;
    if (!canAsk) $("ask-unavailable").innerHTML = "<strong>" + esc(t("h_ask")) + "</strong><br>" + esc(t("ask_unavailable"));
    if (CAP.images) $("file").accept = CAP.images.mediaTypes.join(",");
  }

  /* ======================= scan ======================= */
  const SCAN_PROMPT = [
    "You are reading a photographed shop receipt. Transcribe it into JSON. Accuracy matters more than",
    "completeness: this feeds a price-comparison database, so a mis-read digit becomes a fake price trend.",
    "",
    "Rules:",
    "- Copy every item name EXACTLY as printed, in its own language and script (keep Hebrew as Hebrew).",
    "  Put a best-effort English translation in name_en.",
    "- A weighed line prints as a name row then `0.321 X 6.90` with the line total. That is",
    "  quantity 0.321, unit \"kg\", unit_price 6.90 (price PER KG) and total 2.21. Never swap these.",
    "- Hebrew receipts read right-to-left: total on the left, name in the middle, barcode/PLU on the right.",
    "- Repeated identical lines stay separate lines, quantity 1 each.",
    "- Never invent a barcode or a price. If something is unreadable, keep the line, set confidence below 0.5",
    "  and say what is unclear in notes.",
    "- Dates print DD/MM/YYYY. 18/09/2026 is 18 September 2026.",
    "- Card data: last 4 digits only. Never output a full card number or EMV fields (UID, RRN, AID).",
    "- Israeli receipts: currency ILS, VAT (מע\"מ) is a separate block; copy vat_amount, vat_taxable and",
    "  vat_exempt exactly as printed, do not recompute them.",
    "",
    "Reply with ONLY this JSON object:",
    '{"merchant":{"name":"as printed","name_en":null,"slug":"lowercase-latin-shop-name","branch":null,"tax_id":null,"address":null},',
    ' "document":{"type":"invoice_receipt","number":"...","is_copy":false},',
    ' "purchased_at":"2026-09-18T11:44:00","currency":"ILS",',
    ' "items":[{"line":1,"barcode":"7290...","name":"as printed","name_en":"English","category":"produce",',
    '   "quantity":1,"unit":"each","unit_price":39.9,"total":39.9,"size":null,"vat_exempt":false,"confidence":0.95,"notes":null}],',
    ' "totals":{"items_count":16,"subtotal":426.75,"discount_total":0,"total":426.75,"vat_rate":0.18,',
    '   "vat_amount":62.95,"vat_taxable":349.69,"vat_exempt":14.11},',
    ' "payment":{"method":"credit","amount":426.75,"change":0,"card_brand":null,"card_last4":"7462"},',
    ' "review":{"overall_confidence":0.93,"needs_human_check":[],"notes":null}}',
    "",
    'unit is one of "each", "kg", "g", "l", "ml". size is null or {"value":500,"unit":"ml"} for a packaged size.',
    "category is exactly one of: produce, bakery, dairy_eggs, meat_fish, deli_prepared, frozen, pantry,",
    "snacks_sweets, beverages, alcohol, household, personal_care, baby, pet, other.",
  ].join("\n");

  let scanFile = null, scanReceipt = null, scanCtl = null;

  function status(el, text, busy) {
    el.innerHTML = (busy ? '<span class="spinner"></span>' : "") + "<span>" + esc(text) + "</span>";
  }
  function pickFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    scanFile = file; scanReceipt = null;
    $("scan-stage").hidden = false;
    $("scan-img").src = URL.createObjectURL(file);
    $("scan-result").innerHTML = "";
    $("scan-actions").innerHTML = "";
    runScan();
  }
  async function runScan() {
    const statusEl = $("scan-status");
    status(statusEl, t("scanning"), true);
    $("scan-actions").innerHTML = '<button type="button" class="btn" id="scan-stop">' + esc(t("scan_stop")) + "</button>";
    scanCtl = new AbortController();
    $("scan-stop").onclick = () => scanCtl.abort();
    try {
      const parsed = await CAP.sample.json(SCAN_PROMPT, {
        images: [scanFile], modelTier: "complex", signal: scanCtl.signal,
      });
      scanReceipt = normaliseScan(parsed);
      showScanResult();
    } catch (e) {
      if (e && e.code === "cancelled") { statusEl.textContent = ""; $("scan-actions").innerHTML = ""; return; }
      status(statusEl, "", false);
      const msg = e && e.code === "not_granted" ? t("scan_nogrant") : t("scan_failed", { m: (e && e.code) || "error" });
      $("scan-result").innerHTML = '<div class="notice notice-bad">' + esc(msg) + "</div>";
      $("scan-actions").innerHTML = "";
    }
  }
  function normaliseScan(p) {
    const r = Object.assign({ schema_version: "1.0", demo: false }, p);
    r.items = (r.items || []).map((i, n) => Object.assign({ line: n + 1 }, i));
    const date = String(r.purchased_at || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    const mslug = slug((r.merchant || {}).slug || (r.merchant || {}).name_en || (r.merchant || {}).name || "shop").replace(/[^a-z0-9-]/g, "") || "shop";
    if (!r.merchant) r.merchant = { name: "Unknown", slug: mslug };
    r.merchant.slug = mslug;
    const doc = String(((r.document || {}).number) || Date.now()).replace(/[^A-Za-z0-9-]/g, "") || String(Date.now());
    r.receipt_id = date + "_" + mslug + "_" + doc;
    r.scanned_at = new Date().toISOString().slice(0, 19);
    return r;
  }
  function showScanResult() {
    const r = scanReceipt, problems = checkReceipt(r);
    status($("scan-status"), "", false);
    const totals = r.totals || {};
    let h = "<div class='notice " + (problems.length ? "notice-warn" : "notice-good") + "'>" +
      esc(problems.length ? t("scan_checks_bad", { m: problems.join("; ") }) : t("scan_checks_ok")) + "</div>";
    h += "<div style='font-size:13.5px; margin-bottom:8px'><strong dir='auto'>" + esc((r.merchant || {}).name || "") + "</strong> · " +
      esc((r.purchased_at || "").replace("T", " ")) + " · <span class='num'>" + money(Number(totals.total) || 0) + "</span></div>";
    h += "<div class='scroll' style='max-height:320px; overflow-y:auto'><table><tbody>";
    (r.items || []).forEach((i) => {
      const low = i.confidence != null && i.confidence < 0.8;
      h += "<tr" + (low ? " class='flagrow'" : "") + "><td class='name'><span dir='auto'>" + esc(i.name) + "</span>" +
        (i.name_en ? " <span class='sec'>" + esc(i.name_en) + "</span>" : "") + "</td>" +
        "<td class='n sec'>" + esc(i.quantity) + (i.unit === "kg" ? " kg" : "") + " × " + money(Number(i.unit_price) || 0) + "</td>" +
        "<td class='n'>" + money(Number(i.total) || 0) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    if (scanned.some((s) => s.receipt_id === r.receipt_id)) h += "<div class='notice notice-warn'>" + esc(t("scan_dup")) + "</div>";
    if (!CAP.db) h += "<div class='notice notice-warn'>" + esc(t("scan_nodb")) + "</div>";
    $("scan-result").innerHTML = h;

    const actions = [];
    if (CAP.db) actions.push('<button type="button" class="btn btn-primary" id="do-save">' + esc(t("scan_save")) + "</button>");
    if (CAP.downloads) actions.push('<button type="button" class="btn" id="do-download">' + esc(t("scan_download")) + "</button>");
    actions.push('<button type="button" class="btn" id="do-again">' + esc(t("scan_again")) + "</button>");
    $("scan-actions").innerHTML = actions.join("");
    const save = $("do-save"), dl = $("do-download");
    if (save) save.onclick = saveScan;
    if (dl) dl.onclick = async () => {
      await CAP.downloads.save({ filename: r.receipt_id + ".json", data: JSON.stringify(r, null, 2) }).catch(() => {});
    };
    $("do-again").onclick = () => {
      scanFile = null; scanReceipt = null;
      $("scan-stage").hidden = true; $("file").value = "";
    };
  }
  async function saveScan() {
    const r = scanReceipt, btn = $("do-save");
    btn.disabled = true;
    status($("scan-status"), t("scan_saving"), true);
    try {
      if (CAP.assets && scanFile) {
        const up = await CAP.assets.upload(scanFile).catch(() => null);
        if (up) { r.source_image = up.url; r.image_id = up.id; }
      }
      await CAP.db.collection("receipts").doc(r.receipt_id).set(r);
      status($("scan-status"), t("scan_saved"), false);
      $("scan-actions").innerHTML = '<button type="button" class="btn btn-primary" id="do-again2">' + esc(t("scan_again")) + "</button>";
      $("do-again2").onclick = () => { scanFile = null; scanReceipt = null; $("scan-stage").hidden = true; $("file").value = ""; };
    } catch (e) {
      status($("scan-status"), "", false);
      $("scan-result").insertAdjacentHTML("afterbegin", '<div class="notice notice-bad">' + esc(t("scan_failed", { m: (e && e.code) || "error" })) + "</div>");
      btn.disabled = false;
    }
  }
  function renderSaved() {
    const el = $("t-saved");
    $("saved-hint").textContent = scanned.length ? t("in_view", { n: scanned.length }) : "";
    if (!scanned.length) { emptyState(el, t("saved_none_t"), t("saved_none_d")); return; }
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_date")) + "</th><th>" + esc(t("col_store")) +
      '</th><th class="n">' + esc(t("col_items")) + '</th><th class="n">' + esc(t("col_total")) + "</th><th></th></tr></thead><tbody>";
    [...scanned].sort((a, b) => String(b.purchased_at).localeCompare(String(a.purchased_at))).forEach((r) => {
      h += "<tr><td>" + esc(String(r.purchased_at || "").slice(0, 10)) + "</td>" +
        "<td><span dir='auto'>" + esc((r.merchant || {}).name || "") + "</span></td>" +
        '<td class="n">' + ((r.items || []).length) + '</td><td class="n">' + money(Number((r.totals || {}).total) || 0) + "</td>" +
        '<td class="n"><button type="button" class="btn" data-del="' + esc(r.receipt_id) + '">' + esc(t("delete")) + "</button></td></tr>";
    });
    el.innerHTML = h + "</tbody></table></div>";
    el.querySelectorAll("[data-del]").forEach((b) => {
      b.onclick = async () => {
        if (!CAP.db || !confirm(t("confirm_delete"))) return;
        b.disabled = true;
        await CAP.db.collection("receipts").doc(b.dataset.del).delete().catch(() => { b.disabled = false; });
      };
    });
  }

  /* ======================= ask ======================= */
  function askContext() {
    const rows = allRows(), receipts = allReceipts(), book = priceBook(rows);
    const lines = [];
    lines.push("DATA SUMMARY (currency ILS, all amounts in shekels)");
    lines.push("Receipts: " + receipts.length + " (" + receipts.filter((r) => r.demo).length + " are synthetic demo data), " +
      rows.length + " line items, total spend " + sum(rows, (r) => r.total).toFixed(2));
    const months = [...groupBy(rows, (r) => r.month).entries()].sort((a, b) => a[0].localeCompare(b[0]));
    lines.push("By month: " + months.map(([m, rs]) => m + "=" + sum(rs, (r) => r.total).toFixed(0)).join(", "));
    const bycat = [...groupBy(rows, (r) => r.category).entries()].sort((a, b) => sum(b[1], (r) => r.total) - sum(a[1], (r) => r.total));
    lines.push("By category: " + bycat.map(([c, rs]) => c + "=" + sum(rs, (r) => r.total).toFixed(0)).join(", "));
    const bystore = [...groupBy(rows, (r) => r.merchant_slug).entries()];
    lines.push("By store: " + bystore.map(([s, rs]) => storeName(s) + " (" + s + ")=" + sum(rs, (r) => r.total).toFixed(0)).join(", "));
    const levels = storeLevels(rows, book);
    if (levels.length) lines.push("Store price level, 100 = cheapest on shared products: " + levels.map((s) => s.name + "=" + s.value.toFixed(1)).join(", "));
    const idx = basketIndex(rows);
    if (idx.length > 1) lines.push("Basket price index (100 = " + idx[0].month + "): " + idx.map((p) => p.month + "=" + p.value.toFixed(1)).join(", "));
    lines.push("");
    lines.push("PRODUCTS (name | english | category | latest price per store, on a per-kg/per-litre/per-item basis):");
    [...book.values()].sort((a, b) => sum(b.history, (r) => r.total) - sum(a.history, (r) => r.total)).slice(0, 45).forEach((p) => {
      const per = [...p.stores.entries()].map(([s, v]) => storeName(s) + " " + v.price.toFixed(2) + "/" + p.unit + " (" + v.date + ")").join("; ");
      lines.push("- " + p.name + " | " + (p.name_en || "") + " | " + p.category + " | " + per);
    });
    return lines.join("\n").slice(0, 24000);
  }
  function askRules() {
    return [
      "You are the assistant inside a grocery-spending dashboard called Basket Watch. Answer questions about",
      "the shopping data below.",
      state.lang === "he" ? "Answer in Hebrew." : "Answer in English.",
      "Rules: use only the data given or what the query_lines tool returns — never invent a number. Amounts are",
      "shekels (₪). Prices per kg/litre/item are already normalised, so they are comparable across stores and",
      "pack sizes. Some receipts are synthetic demo data and are marked as such — say so if it matters to the",
      "answer. Be brief: a couple of sentences or a short list, with the numbers that back it up. If the data",
      "cannot answer the question, say what is missing.",
      "",
      askContext(),
    ].join("\n");
  }
  function askTools() {
    if (!CAP.tools) return undefined;
    return [{
      name: "query_lines",
      description: "Filter the receipt line items and return the matching total, count and the biggest lines. " +
        "Use it for any question about a specific period, store, category or product. Returns JSON.",
      inputSchema: {
        type: "object",
        properties: {
          from: { type: "string", description: "earliest date, YYYY-MM-DD" },
          to: { type: "string", description: "latest date, YYYY-MM-DD" },
          store: { type: "string", description: "merchant slug" },
          category: { type: "string", description: "one category key" },
          text: { type: "string", description: "substring of the product name, Hebrew or English" },
          include_demo: { type: "boolean", description: "include synthetic demo receipts (default true)" },
        },
      },
      execute(input) {
        const q = String(input.text || "").toLowerCase();
        const hit = allRows().filter((r) =>
          (input.include_demo === false ? !r.demo : true) &&
          (!input.from || r.date >= String(input.from)) && (!input.to || r.date <= String(input.to)) &&
          (!input.store || r.merchant_slug === String(input.store)) &&
          (!input.category || r.category === String(input.category)) &&
          (!q || r.name.toLowerCase().includes(q) || (r.name_en || "").toLowerCase().includes(q)));
        return {
          lines: hit.length,
          total: Math.round(sum(hit, (r) => r.total) * 100) / 100,
          by_store: [...groupBy(hit, (r) => r.merchant_slug).entries()].map(([s, rs]) => ({ store: storeName(s), total: Math.round(sum(rs, (r) => r.total) * 100) / 100 })),
          top: [...hit].sort((a, b) => b.total - a.total).slice(0, 15).map((r) => ({
            date: r.date, name: r.name, en: r.name_en, store: r.merchant_name,
            qty: r.quantity, unit: r.unit, paid: r.total, per_base: r.base_price + "/" + r.base_unit, demo: r.demo,
          })),
        };
      },
    }];
  }
  let askTurns = [], askCtl = null;
  function bubble(who, text, cls) {
    const d = document.createElement("div");
    d.className = "bubble " + cls;
    d.innerHTML = "<div class='who'>" + esc(who) + "</div><div class='body'></div>";
    d.querySelector(".body").textContent = text;
    $("ask-thread").appendChild(d);
    d.scrollIntoView({ block: "nearest" });
    return d.querySelector(".body");
  }
  async function ask(question) {
    if (!question.trim() || !CAP.sample) return;
    $("ask-input").value = "";
    bubble(t("you"), question, "me");
    const out = bubble(t("claude"), t("ask_thinking"), "ai");
    askTurns.push({ role: "user", content: question });
    $("ask-send").disabled = true;
    $("ask-stop").hidden = false;
    askCtl = new AbortController();
    try {
      const opts = {
        signal: askCtl.signal, cache: false,
        onText: ({ text }) => { out.textContent = text; },
      };
      const tools = askTools();
      if (tools) { opts.tools = tools; delete opts.cache; }   // tools and cache cannot both be passed
      const { text } = await CAP.sample([{ role: "user", content: askRules() }, ...askTurns], opts);
      askTurns.push({ role: "assistant", content: text });
      if (askTurns.length > 8) askTurns = askTurns.slice(-8);
    } catch (e) {
      if (e && e.code === "cancelled") { out.textContent = e.text || ""; }
      else { out.textContent = (e && e.text) || t("ask_failed", { m: (e && e.code) || "error" }); }
      askTurns.pop();
    } finally {
      $("ask-send").disabled = false;
      $("ask-stop").hidden = true;
      askCtl = null;
    }
  }

  /* ======================= language, controls, tabs ======================= */
  const STATIC = {
    "brand-name": "brand", "tab-dash": "tab_dash", "tab-scan": "tab_scan", "tab-ask": "tab_ask",
    "f-demo-label": "demo_switch", "demo-pill": "demo_pill",
    "h-months": "h_months", "s-months": "s_months", "h-cats": "h_cats", "s-cats": "s_cats",
    "h-index": "h_index", "s-index": "s_index", "hint-index": "hint_index",
    "h-stores": "h_stores", "s-stores": "s_stores", "hint-stores": "hint_stores",
    "h-compare": "h_compare", "s-compare": "s_compare",
    "h-movers": "h_movers", "s-movers": "s_movers", "hint-movers": "hint_movers",
    "h-receipts": "h_receipts", "s-receipts": "s_receipts",
    "h-lines": "h_lines", "s-lines": "s_lines",
    "h-scan": "h_scan", "s-scan": "s_scan", "drop-title": "drop_title", "drop-sub": "drop_sub", "pick": "pick",
    "h-saved": "h_saved", "s-saved": "s_saved",
    "h-ask": "h_ask", "s-ask": "s_ask", "ask-send": "ask_send", "ask-stop": "ask_stop", "ask-note": "ask_note",
    "foot-text": "foot",
  };
  function applyLang() {
    const l = L();
    document.documentElement.lang = state.lang;
    document.documentElement.dir = l.dir;
    Object.keys(STATIC).forEach((id) => { const el = $(id); if (el) el.textContent = t(STATIC[id]); });
    $("f-q").placeholder = t("search_ph");
    $("ask-input").placeholder = t("ask_ph");
    $("lang-he").setAttribute("aria-pressed", String(state.lang === "he"));
    $("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));
    $("built").textContent = DATA.meta.generated_at ? t("built", { d: DATA.meta.generated_at.replace("T", " ").slice(0, 16) }) : "";
    fillControls();
    fillSuggestions();
    if (CAP.ready) paintCapStates();
  }
  function option(v, label, sel) { return '<option value="' + esc(v) + '"' + (sel ? " selected" : "") + ">" + esc(label) + "</option>"; }
  function fillControls() {
    $("f-period").innerHTML = [option("all", t("all_time"), state.period === "all")]
      .concat([3, 6, 12].map((n) => option(String(n), t("last_n", { n }), state.period === String(n)))).join("");
    const stores = [...new Set(allRows().map((r) => r.merchant_slug))].sort();
    $("f-store").innerHTML = option("all", t("all_stores"), state.store === "all") +
      stores.map((s) => option(s, storeName(s), state.store === s)).join("");
    const cats = [...new Set(allRows().map((r) => r.category))].sort();
    $("f-cat").innerHTML = option("all", t("all_cats"), state.cat === "all") +
      cats.map((c) => option(c, catLabel(c), state.cat === c)).join("");
    $("f-currency").innerHTML = CURRENCIES.map((c) => option(c, c, state.currency === c)).join("");
    const rate = $("f-rate");
    rate.hidden = state.currency === "ILS";
    rate.placeholder = t("rate_ph");
    rate.title = t("rate_title", { c: state.currency });
    rate.value = state.rate || "";
    $("f-demo").checked = state.demo;
    const demoLabel = $("f-demo").closest("label");
    if (demoLabel) demoLabel.hidden = !DATA.meta.demo_receipts;
  }
  function fillSuggestions() {
    $("ask-suggest").innerHTML = ["s1", "s2", "s3", "s4"]
      .map((k) => '<button type="button" data-q="' + esc(t(k)) + '">' + esc(t(k)) + "</button>").join("");
    $("ask-suggest").querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => ask(b.dataset.q); });
  }
  function setTab(tab) {
    state.tab = ["dash", "scan", "ask"].includes(tab) ? tab : "dash";
    store.set("tab", state.tab);
    ["dash", "scan", "ask"].forEach((n) => {
      $("view-" + n).hidden = n !== state.tab;
      $("tab-" + n).setAttribute("aria-selected", String(n === state.tab));
    });
    renderCurrent();
  }
  function renderCurrent() {
    const showBand = state.tab === "dash" && state.demo && !!DATA.meta.demo_receipts;
    $("demo-band").hidden = !showBand;
    if (showBand) {
      $("demo-band-text").textContent = t("demo_text", { n: DATA.meta.demo_receipts, r: DATA.meta.real_receipts + scanned.length });
    }
    if (state.tab === "dash") renderDash();
    else if (state.tab === "scan") renderSaved();
  }

  function wire() {
    $("lang-he").onclick = () => { state.lang = "he"; store.set("lang", "he"); fmtCache.clear(); applyLang(); renderCurrent(); };
    $("lang-en").onclick = () => { state.lang = "en"; store.set("lang", "en"); fmtCache.clear(); applyLang(); renderCurrent(); };
    $("f-currency").onchange = (e) => {
      state.currency = e.target.value; store.set("currency", state.currency);
      fmtCache.clear(); fillControls(); renderCurrent();
    };
    $("f-rate").oninput = (e) => {
      const v = Number(e.target.value);
      state.rate = v > 0 ? v : null;
      store.set("rate", state.rate);
      renderCurrent();
    };
    $("tab-dash").onclick = () => setTab("dash");
    $("tab-scan").onclick = () => setTab("scan");
    $("tab-ask").onclick = () => setTab("ask");
    $("f-demo").onchange = (e) => { state.demo = e.target.checked; renderCurrent(); };
    $("f-period").onchange = (e) => { state.period = e.target.value; renderCurrent(); };
    $("f-store").onchange = (e) => { state.store = e.target.value; renderCurrent(); };
    $("f-cat").onchange = (e) => { state.cat = e.target.value; renderCurrent(); };
    let qt;
    $("f-q").oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; renderCurrent(); }, 140); };

    $("pick").onclick = () => $("file").click();
    $("file").onchange = (e) => pickFile(e.target.files && e.target.files[0]);
    const drop = $("drop");
    ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) pickFile(f);
    });

    $("ask-form").onsubmit = (e) => { e.preventDefault(); ask($("ask-input").value); };
    $("ask-input").onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask($("ask-input").value); }
    };
    $("ask-stop").onclick = () => { if (askCtl) askCtl.abort(); };

    let rt;
    addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderCurrent, 160); });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderCurrent);
  }

  assignStoreColours();
  wire();
  applyLang();
  setTab(store.get("tab", "dash"));
  initCaps();
})();
</script>

</body>
</html>
