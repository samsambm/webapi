<title>Basket Watch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground:#f4f6f5; --surface:#ffffff; --surface-2:#f8faf9; --raise:#ffffff;
    --ink:#0f1512; --ink-2:#3d4a44; --muted:#66736d;
    --hairline:#e0e6e2; --hairline-2:#edf1ee;
    --accent:#0b7a5e; --accent-mark:#12a077; --accent-soft:#e4f2ec; --accent-ink:#ffffff;
    --bad:#c2352f; --bad-soft:#fdeceb; --flag:#8a5d00; --flag-soft:#fdf3e0;
    --store-1:#0b7a5e; --store-2:#c25a1e; --store-3:#2a6fd6;
    --shadow-sm:0 1px 2px rgba(15,21,18,.05);
    --shadow:0 1px 2px rgba(15,21,18,.04), 0 10px 28px -18px rgba(15,21,18,.28);
    --r-lg:16px; --r:12px; --r-sm:9px;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"Heebo", ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
    --navh:64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0e1211; --surface:#161b19; --surface-2:#1b211e; --raise:#1f2623;
      --ink:#edf2ef; --ink-2:#c2ccc7; --muted:#8e9c96;
      --hairline:#252d29; --hairline-2:#1f2622;
      --accent:#2fb489; --accent-mark:#2fb489; --accent-soft:#11291f; --accent-ink:#06120d;
      --bad:#e66767; --bad-soft:#2a1615; --flag:#d9a94e; --flag-soft:#241d10;
      --store-1:#2fb489; --store-2:#d9743a; --store-3:#4a8ae8;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0e1211; --surface:#161b19; --surface-2:#1b211e; --raise:#1f2623;
    --ink:#edf2ef; --ink-2:#c2ccc7; --muted:#8e9c96;
    --hairline:#252d29; --hairline-2:#1f2622;
    --accent:#2fb489; --accent-mark:#2fb489; --accent-soft:#11291f; --accent-ink:#06120d;
    --bad:#e66767; --bad-soft:#2a1615; --flag:#d9a94e; --flag-soft:#241d10;
    --store-1:#2fb489; --store-2:#d9743a; --store-3:#4a8ae8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap { max-width:1120px; margin:0 auto; padding-inline:16px; }
  h1,h2,h3 { margin:0; text-wrap:balance; letter-spacing:-.015em; }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .eyebrow { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  /* ---------- chrome ---------- */
  .topbar {
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:var(--ground); border-bottom:1px solid var(--hairline);
  }
  .topbar-inner { display:flex; align-items:center; gap:12px; padding-block:10px; }
  .brand { display:flex; align-items:center; gap:9px; margin-inline-end:auto; min-width:0; overflow:hidden; }
  .brand .logo {
    width:28px; height:28px; border-radius:8px; background:var(--accent); flex:none;
    display:grid; place-items:center; color:var(--accent-ink);
  }
  .brand .logo svg { width:16px; height:16px; display:block; }
  .brand h1 { font-size:17px; font-weight:800; white-space:nowrap; }
  .brand .tick { font-size:11px; color:var(--muted); font-weight:500; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .chrome-controls { display:flex; gap:7px; align-items:center; flex:none; }

  select, input[type="search"], input[type="text"], input[type="number"], input[type="password"], textarea {
    font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
    border:1px solid var(--hairline); border-radius:var(--r-sm); padding:8px 10px; min-width:0;
    -webkit-appearance:none; appearance:none;
  }
  select { padding-inline-end:26px;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
  :where(select,input,textarea,button,[tabindex]):focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { font:inherit; cursor:pointer; }
  .btn {
    font-size:13.5px; font-weight:600; border-radius:var(--r-sm); padding:9px 14px;
    border:1px solid var(--hairline); background:var(--surface); color:var(--ink);
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.07); color:var(--accent-ink); }
  .btn-lg { font-size:15px; padding:12px 20px; border-radius:var(--r); }
  .seg { display:inline-flex; border:1px solid var(--hairline); border-radius:var(--r-sm); overflow:hidden; background:var(--surface); }
  .seg button { border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; padding:7px 10px; }
  .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); }

  /* tabs: top on desktop, bottom bar on phones */
  .tabs-top { display:flex; gap:4px; }
  .tabs-top button {
    border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:600;
    padding:12px 14px; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabs-top button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .tabbar { display:none; }
  @media (max-width:700px) {
    .tabs-top { display:none; }
    .tabbar {
      display:grid; grid-template-columns:repeat(3,1fr); position:fixed; inset-inline:0; bottom:0; z-index:50;
      background:var(--surface); border-top:1px solid var(--hairline);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    .tabbar button {
      border:0; background:transparent; color:var(--muted); font-size:11px; font-weight:600;
      display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px;
    }
    .tabbar button svg { width:21px; height:21px; }
    .tabbar button[aria-selected="true"] { color:var(--accent); }
    body { padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px)); }
  }

  /* ---------- surfaces ---------- */
  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:18px; }
  .card.flat { box-shadow:none; }
  .card + .card, .grid + .card, .card + .grid, .grid + .grid, .card + .filters { margin-top:14px; }
  .card-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .card h2 { font-size:15.5px; font-weight:700; }
  .card .sub { font-size:12.5px; color:var(--muted); margin:4px 0 16px; }
  .card .hint { font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; align-items:start; }

  /* hero */
  .hero { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
          padding:20px; margin-top:16px; display:flex; gap:22px; flex-wrap:wrap; align-items:flex-end; }
  .hero .total { display:flex; flex-direction:column; gap:3px; margin-inline-end:auto; }
  .hero .total .v { font-family:var(--mono); font-size:38px; font-weight:600; letter-spacing:-.035em; line-height:1; }
  .hero .total .sub { font-size:12.5px; color:var(--muted); }
  .hero .side { display:flex; gap:26px; flex-wrap:wrap; }
  .hero .side div { display:flex; flex-direction:column; gap:2px; }
  .hero .side .v { font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .hero .side .v.warn { color:var(--bad); }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .stat { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r); padding:13px 14px; }
  .stat .v { font-family:var(--mono); font-size:19px; font-weight:600; margin-top:5px; letter-spacing:-.02em; }
  .stat .n { font-size:11.5px; color:var(--muted); margin-top:2px; }

  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
  .filters input[type="search"] { flex:1; min-width:150px; }

  .chart { width:100%; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }

  .empty { border:1px dashed var(--hairline); border-radius:var(--r); padding:26px 18px; text-align:center; background:var(--surface-2); }
  .empty .ico { display:block; width:34px; height:34px; margin:0 auto 10px; color:var(--muted); opacity:.7; }
  .empty .ico svg, .drop .ico svg { display:block; width:100%; height:100%; }
  .empty strong { display:block; color:var(--ink-2); font-weight:700; font-size:14px; margin-bottom:5px; }
  .empty span { color:var(--muted); font-size:13px; display:block; max-width:44ch; margin:0 auto; }
  .empty .btn { margin-top:14px; }

  /* tables */
  .scroll { overflow-x:auto; margin-inline:-4px; padding-inline:4px; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:start; padding:9px 10px; border-bottom:1px solid var(--hairline-2); white-space:nowrap; }
  th { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700;
       border-bottom:1px solid var(--hairline); position:sticky; top:0; background:var(--surface); }
  th[role="button"] { cursor:pointer; user-select:none; }
  th[role="button"]:hover { color:var(--ink); }
  td.n, th.n { text-align:end; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:var(--surface-2); }
  td.name { white-space:normal; min-width:180px; max-width:320px; }
  .sec { font-size:12px; color:var(--muted); }
  .best { color:var(--accent); font-weight:700; }
  .delta-up { color:var(--bad); font-weight:600; }
  .delta-down { color:var(--accent); font-weight:600; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); }
  .dot { width:8px; height:8px; border-radius:99px; flex:none; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; }
  .flagrow td { background:var(--flag-soft); }
  .flagpill { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--flag); }

  /* scan */
  .drop { border:2px dashed var(--hairline); border-radius:var(--r-lg); background:var(--surface-2);
          padding:30px 18px; text-align:center; transition:border-color .12s, background .12s; }
  .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop .ico { display:block; width:40px; height:40px; margin:0 auto 12px; color:var(--accent); }
  .drop h3 { font-size:17px; margin-bottom:5px; }
  .drop p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .drop .row { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
  /* Not display:none — a hidden file input cannot be opened by script on several
     mobile browsers, so it stays in the layout and a <label> opens it natively. */
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
             overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  label.btn { cursor:pointer; }
  .sr-only:focus-visible + .row label, label.btn:focus-within { outline:2px solid var(--accent); outline-offset:1px; }
  .shots-row { display:flex; gap:8px; overflow-x:auto; padding-block:2px 6px; }
  .shot { position:relative; flex:none; }
  .shot img { width:74px; height:100px; object-fit:cover; border-radius:9px; border:1px solid var(--hairline); display:block; }
  .shot .n { position:absolute; inset-inline-start:4px; top:4px; background:var(--accent); color:var(--accent-ink);
             font-size:10px; font-weight:700; border-radius:99px; padding:1px 7px; }
  .shot .x { position:absolute; inset-inline-end:3px; top:3px; border:0; padding:0; width:19px; height:19px;
             border-radius:99px; background:rgba(0,0,0,.62); color:#fff; font-size:12px; line-height:19px; }
  .preview { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .preview img { max-height:300px; max-width:100%; border-radius:var(--r); border:1px solid var(--hairline); }
  .preview .pane { flex:1; min-width:250px; }
  .status { display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-2); min-height:22px; }
  .spinner { width:15px; height:15px; border:2px solid var(--hairline); border-top-color:var(--accent);
             border-radius:50%; animation:spin .7s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .notice { border-radius:var(--r-sm); padding:11px 13px; font-size:13px; margin-block:12px; border:1px solid; }
  .notice-warn { background:var(--flag-soft); border-color:color-mix(in srgb,var(--flag) 35%,transparent); color:var(--flag); }
  .notice-bad { background:var(--bad-soft); border-color:color-mix(in srgb,var(--bad) 35%,transparent); color:var(--bad); }
  .notice-good { background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 30%,transparent); color:var(--accent); }
  .row-actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label { font-size:12.5px; font-weight:600; color:var(--ink-2); }
  .field .help { font-size:12px; color:var(--muted); }
  .key-row { display:flex; gap:8px; flex-wrap:wrap; }
  .key-row input { flex:1; min-width:200px; font-family:var(--mono); font-size:12.5px; }
  details.settings { border:1px solid var(--hairline); border-radius:var(--r); padding:0; overflow:hidden; margin-top:14px; }
  details.settings > summary { padding:12px 14px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink-2); list-style:none; }
  details.settings > summary::-webkit-details-marker { display:none; }
  details.settings > summary::after { content:"›"; float:inline-end; color:var(--muted); }
  details.settings[open] > summary { border-bottom:1px solid var(--hairline); }
  details.settings .body { padding:14px; }

  /* ask */
  .ask-thread { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .bubble { border-radius:var(--r); padding:12px 14px; font-size:14.5px; max-width:min(660px,100%); white-space:pre-wrap; }
  .bubble.me { background:var(--accent-soft); color:var(--ink); align-self:flex-end; }
  .bubble.ai { background:var(--surface-2); border:1px solid var(--hairline); align-self:flex-start; }
  .bubble .who { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:5px; }
  .ask-form { display:flex; gap:8px; align-items:flex-end; }
  .ask-form textarea { flex:1; resize:vertical; min-height:48px; font-size:14.5px; }
  .suggest { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .suggest button { font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
                    border:1px solid var(--hairline); border-radius:99px; padding:7px 13px; }
  .suggest button:hover { border-color:var(--accent); color:var(--accent); }

  #tip { position:fixed; inset-inline-start:0; top:0; z-index:90; pointer-events:none; opacity:0; transition:opacity .09s;
         background:var(--raise); color:var(--ink); border:1px solid var(--hairline); border-radius:var(--r-sm);
         padding:8px 11px; font-size:12.5px; box-shadow:var(--shadow); max-width:260px; }
  #tip .t-title { font-weight:700; margin-bottom:3px; }
  #tip .t-row { color:var(--ink-2); font-family:var(--mono); font-size:11.5px; }
  .mark { transition:opacity .1s; }
  .mark:hover { opacity:.82; }

  footer { color:var(--muted); font-size:12px; padding-block:26px 34px; }
  footer code { font-family:var(--mono); font-size:11px; color:var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { *, .spinner { animation:none !important; transition:none !important; } }
  @media (max-width:560px) {
    .brand .tick { display:none; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .hero { padding:16px; }
    .hero .total .v { font-size:31px; }
    .card { padding:15px; border-radius:var(--r); }
    .wrap { padding-inline:14px; }
  }
</style>

<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3h14v17l-2.3-2-2.3 2-2.4-2-2.3 2-2.4-2L5 20z"/><path d="M9 8h6M9 12h6M9 16h3"/>
        </svg>
      </span>
      <h1 id="brand-name">Basket Watch</h1>
      <span class="tick" id="range-tick"></span>
    </div>
    <div class="chrome-controls">
      <span class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-he" aria-pressed="false">עב</button>
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
      </span>
      <select id="f-currency" aria-label="Currency"></select>
      <input type="number" id="f-rate" step="0.0001" min="0" style="width:82px" hidden>
    </div>
  </div>
  <div class="wrap"><div class="tabs-top" role="tablist">
    <button type="button" role="tab" data-tab="dash" aria-selected="true"></button>
    <button type="button" role="tab" data-tab="scan" aria-selected="false"></button>
    <button type="button" role="tab" data-tab="ask" aria-selected="false"></button>
  </div></div>
</div>

<main class="wrap">
  <!-- ===================== dashboard ===================== -->
  <section id="view-dash">
    <div class="hero">
      <div class="total">
        <span class="eyebrow" id="hero-label"></span>
        <span class="v" id="hero-total">—</span>
        <span class="sub" id="hero-sub"></span>
      </div>
      <div class="side" id="hero-side"></div>
    </div>
    <div class="stats" id="stats"></div>

    <div class="filters">
      <select id="f-period" aria-label="Period"></select>
      <select id="f-store" aria-label="Store"></select>
      <select id="f-cat" aria-label="Category"></select>
      <input type="search" id="f-q" aria-label="Search">
    </div>

    <div class="grid" style="margin-top:14px">
      <section class="card">
        <div class="card-head"><h2 id="h-cats"></h2><span class="hint" id="cat-hint"></span></div>
        <p class="sub" id="s-cats"></p><div class="chart" id="c-cats"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 id="h-months"></h2><span class="hint" id="spend-hint"></span></div>
        <p class="sub" id="s-months"></p><div class="chart" id="c-months"></div>
      </section>
    </div>

    <div class="grid">
      <section class="card">
        <div class="card-head"><h2 id="h-index"></h2><span class="hint" id="hint-index"></span></div>
        <p class="sub" id="s-index"></p><div class="chart" id="c-index"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 id="h-stores"></h2><span class="hint" id="hint-stores"></span></div>
        <p class="sub" id="s-stores"></p><div class="chart" id="c-stores"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2 id="h-compare"></h2><span class="hint" id="cmp-hint"></span></div>
      <p class="sub" id="s-compare"></p><div id="t-compare"></div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-head"><h2 id="h-movers"></h2><span class="hint" id="hint-movers"></span></div>
        <p class="sub" id="s-movers"></p><div id="t-movers"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 id="h-receipts"></h2><span class="hint" id="rec-hint"></span></div>
        <p class="sub" id="s-receipts"></p><div id="t-receipts"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head"><h2 id="h-lines"></h2><span class="hint" id="lines-hint"></span></div>
      <p class="sub" id="s-lines"></p><div id="t-lines"></div>
    </section>
  </section>

  <!-- ===================== scan ===================== -->
  <section id="view-scan" hidden>
    <section class="card" style="margin-top:16px">
      <div class="card-head"><h2 id="h-scan"></h2><span class="hint" id="scan-engine"></span></div>
      <p class="sub" id="s-scan"></p>

      <div id="scan-ui">

  /** The same arithmetic the Python validator enforces, run before a scan can be saved. */
  function checkReceipt(r) {
    const problems = [], items = r.items || [];
    if (!items.length) problems.push("no items");
    items.forEach((i) => {
      const expect = Math.round((Number(i.quantity) || 0) * (Number(i.unit_price) || 0) * 100) / 100;
      if (Math.abs(expect - (Number(i.total) || 0)) > 0.02) {
        problems.push("line " + i.line + ": " + i.quantity + " × " + i.unit_price + " = " + expect.toFixed(2) + " ≠ " + Number(i.total).toFixed(2));
      }
    });
    const stated = Number((r.totals || {}).total);
    if (stated) {
      const lineSum = Math.round(sum(items, (i) => Number(i.total) || 0) * 100) / 100;
      if (Math.abs(lineSum - stated) > 0.05) problems.push("lines sum to " + lineSum.toFixed(2) + ", receipt says " + stated.toFixed(2));
    }
    return problems;
  }

  /* ========================= talking to Claude =========================
     Three ways in, tried in this order:
       "sample" — the published artifact's own runtime. Free to the page owner,
                  billed to whoever opens it. No key anywhere.
       "key"    — this device's own Anthropic API key. In the Android app the
                  request goes through a tiny native bridge, which sidesteps
                  browser CORS entirely; elsewhere it is a plain fetch.
       "none"   — no way to reach Claude: the scan and ask screens say so.        */
  const AI = {
    mode: "none", sample: null, imageLimits: null, native: null, _cb: 0, _pending: {},

    // A key typed on the device wins; otherwise a key baked in at build time,
    // which only exists in a local build the owner installs themselves.
    key() { return String(store.get("apikey", "") || (DATA.meta && DATA.meta.embedded_key) || ""); },
    embedded() { return !!(DATA.meta && DATA.meta.embedded_key) && !store.get("apikey", ""); },
    hasKey() { return this.key().length > 10; },

    async init() {
      const claude = window.claude;
      if (claude && typeof claude.use === "function") {
        this.sample = await claude.use("sample").catch(() => null);
        if (this.sample) {
          const lim = await this.sample.limits().catch(() => null);
          this.imageLimits = (lim && lim.images) || null;
        }
      }
      this.native = (window.BasketWatchNative && typeof window.BasketWatchNative.post === "function")
        ? window.BasketWatchNative : null;
      window.__nativePost = (id, status, text) => {
        const fn = this._pending[id];
        if (fn) { delete this._pending[id]; fn(status, text); }
      };
      this.refresh();
    },
    refresh() {
      this.mode = this.sample ? "sample" : (this.hasKey() ? "key" : "none");
      return this.mode;
    },
    /* A viewer can be able to ask Claude but not to send it a photo — the
       artifact runtime reports that separately, and a mobile browser view is
       exactly the case. Gate the two screens on the right one. */
    imageMode() {
      if (this.sample && this.imageLimits) return "sample";
      return this.hasKey() ? "key" : "none";
    },
    textMode() { return this.sample ? "sample" : (this.hasKey() ? "key" : "none"); },

    _post(body) {
      const key = this.key();
      if (this.native) {
        return new Promise((resolve, reject) => {
          const id = "cb" + (++this._cb);
          this._pending[id] = (status, text) => {
            let parsed = null;
            try { parsed = JSON.parse(text); } catch (e) { /* non-JSON body */ }
            if (!parsed) return reject({ code: "bad_response", message: String(text).slice(0, 300) });
            if (status >= 400 || parsed.error) {
              return reject({ code: (parsed.error && parsed.error.type) || ("http_" + status),
                              message: (parsed.error && parsed.error.message) || ("HTTP " + status) });
            }
            resolve(parsed);
          };
          try { this.native.post(key, JSON.stringify(body), id); }
          catch (e) { delete this._pending[id]; reject({ code: "native_error", message: String(e) }); }
        });
      }
      return fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify(body),
      }).then(async (res) => {
        const parsed = await res.json().catch(() => null);
        if (!parsed) throw { code: "bad_response", message: "HTTP " + res.status };
        if (!res.ok || parsed.error) {
          throw { code: (parsed.error && parsed.error.type) || ("http_" + res.status),
                  message: (parsed.error && parsed.error.message) || ("HTTP " + res.status) };
        }
        return parsed;
      }, (e) => { throw { code: "network", message: String(e && e.message || e) }; });
    },

    textOf(response) {
      return (response.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
    },
    parseJson(text) {
      const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      const body = fence ? fence[1] : text;
      const start = body.search(/[[{]/), end = Math.max(body.lastIndexOf("}"), body.lastIndexOf("]"));
      if (start < 0 || end <= start) throw { code: "invalid_json", message: text.slice(0, 200) };
      return JSON.parse(body.slice(start, end + 1));
    },
    blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onerror = () => reject({ code: "read_failed", message: "could not read the image" });
        r.onload = () => resolve(String(r.result).split(",")[1]);
        r.readAsDataURL(blob);
      });
    },

    /** How many photos one request may carry. */
    maxImages() {
      if (this.imageMode() === "sample") return (this.imageLimits && this.imageLimits.maxCount) || 4;
      return 8;
    },

    /** Read one or more photos of the SAME receipt and return parsed JSON. */
    async readImages(prompt, blobs, opts) {
      const o = opts || {};
      if (this.imageMode() === "sample") {
        return this.sample.json(prompt, { images: blobs, modelTier: "complex", signal: o.signal });
      }
      const parts = [];
      for (const blob of blobs) {
        parts.push({
          type: "image",
          source: { type: "base64", media_type: blob.type || "image/jpeg", data: await this.blobToBase64(blob) },
        });
      }
      parts.push({ type: "text", text: prompt });
      const response = await this._post({
        model: (DATA.meta && DATA.meta.scan_model) || "claude-sonnet-5",
        max_tokens: 16000,
        messages: [{ role: "user", content: parts }],
      });
      return this.parseJson(this.textOf(response));
    },

    /** Ask a text question. Streams where the runtime can; otherwise resolves once. */
    async askText(turns, opts) {
      const o = opts || {};
      if (this.textMode() === "sample") {
        const res = await this.sample(turns, { cache: false, signal: o.signal, onText: o.onText });
        return res.text;
      }
      const response = await this._post({
        model: (DATA.meta && DATA.meta.scan_model) || "claude-sonnet-5",
        max_tokens: 8000,
        messages: turns.map((m) => ({ role: m.role, content: m.content })),
      });
      const text = this.textOf(response);
      if (o.onText) o.onText({ text: text, delta: text });
      return text;
    },
  };

  /* ========================= where receipts live ========================= */
  const Receipts = {
    mode: "memory", db: null, assets: null, downloads: null, items: [], notify: function () {},

    async init(onChange) {
      this.notify = onChange;
      const claude = window.claude;
      if (claude && typeof claude.use === "function") {
        this.db = await claude.use("db").catch(() => null);
        this.assets = await claude.use("assets").catch(() => null);
        this.downloads = await claude.use("downloads").catch(() => null);
      }
      if (this.db) {
        this.mode = "db";
        this.db.collection("receipts").onSnapshot(
          (snap) => {
            this.items = snap.docs.map((d) => d.data()).filter((r) => r && r.items && r.receipt_id);
            this.notify();
          },
          () => { /* terminal db error: the page keeps working on built-in data */ },
        );
      } else {
        this.mode = "local";
        const saved = store.get("receipts", []);
        this.items = Array.isArray(saved) ? saved.filter((r) => r && r.items && r.receipt_id) : [];
        this.notify();
      }
    },
    has(id) { return this.items.some((r) => r.receipt_id === id); },
    async save(receipt) {
      if (this.mode === "db") { await this.db.collection("receipts").doc(receipt.receipt_id).set(receipt); return; }
      this.items = this.items.filter((r) => r.receipt_id !== receipt.receipt_id).concat([receipt]);
      store.set("receipts", this.items);
      this.notify();
    },
    async remove(id) {
      if (this.mode === "db") { await this.db.collection("receipts").doc(id).delete(); return; }
      this.items = this.items.filter((r) => r.receipt_id !== id);
      store.set("receipts", this.items);
      this.notify();
    },
  };


  /* ========================= the account, when there is one =========================
     Off entirely unless the build was given a server and a Supabase project
     (BW_API_URL / BW_SUPABASE_URL / BW_SUPABASE_ANON_KEY). With it on, receipts
     live in the user's own rows in Postgres, scanning goes through the server
     that holds the Anthropic key, and the free/paid quota is enforced there —
     never here, where anyone could edit it.                                        */
  const Cloud = {
    cfg: (DATA.meta && DATA.meta.cloud) || {},
    session: null, account: null, rows: [], cards: [],

    on() { return !!(this.cfg.api_url && this.cfg.supabase_url && this.cfg.supabase_anon_key); },
    signedIn() { return !!(this.session && this.session.access_token); },

    async auth(path, body) {
      const res = await fetch(this.cfg.supabase_url + "/auth/v1/" + path, {
        method: "POST",
        headers: { "content-type": "application/json", apikey: this.cfg.supabase_anon_key },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw { message: data.error_description || data.msg || data.message || ("HTTP " + res.status) };
      return data;
    },
    keep(session) {
      this.session = session && session.access_token ? session : null;
      if (this.session) store.set("session", this.session); else store.del("session");
    },

    async signIn(email, password) {
      this.keep(await this.auth("token?grant_type=password", { email: email, password: password }));
      await this.load();
    },
    async signUp(email, password) {
      const out = await this.auth("signup", { email: email, password: password });
      // A project with email confirmation on returns no session until the link is clicked.
      if (out.access_token) { this.keep(out); await this.load(); return { confirmed: true }; }
      return { confirmed: false };
    },
    async refresh() {
      if (!this.session || !this.session.refresh_token) return false;
      try {
        this.keep(await this.auth("token?grant_type=refresh_token", { refresh_token: this.session.refresh_token }));
        return true;
      } catch (e) { this.keep(null); return false; }
    },
    signOut() {
      this.keep(null);
      this.account = null; this.rows = []; this.cards = [];
    },
    googleUrl() {
      return this.cfg.supabase_url + "/auth/v1/authorize?provider=google&redirect_to=" +
        encodeURIComponent(location.href.split("#")[0]);
    },

    async api(path, opts) {
      const o = opts || {};
      const headers = Object.assign({ authorization: "Bearer " + this.session.access_token }, o.headers || {});
      let res = await fetch(this.cfg.api_url + path, Object.assign({}, o, { headers: headers }));
      if (res.status === 401 && await this.refresh()) {
        headers.authorization = "Bearer " + this.session.access_token;
        res = await fetch(this.cfg.api_url + path, Object.assign({}, o, { headers: headers }));
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign({ status: res.status }, (data && data.detail) || { message: data.message || ("HTTP " + res.status) });
      return data;
    },
    async rest(path) {
      const res = await fetch(this.cfg.supabase_url + "/rest/v1" + path, {
        headers: { apikey: this.cfg.supabase_anon_key, authorization: "Bearer " + this.session.access_token },
      });
      if (!res.ok) throw { message: "HTTP " + res.status };
      return res.json();
    },

    /** Pull the account and every receipt the signed-in user owns. */
    async load() {
      if (!this.signedIn()) return;
      this.account = await this.api("/me").catch(() => null);
      const data = await this.rest("/receipts?select=*,receipt_items(*)&order=purchased_at.desc").catch(() => []);
      this.cards = data.map((r) => ({
        receipt_id: r.id, date: String(r.purchased_at || "").slice(0, 10),
        merchant_slug: r.merchant_slug, merchant_name: r.merchant_name,
        total: Number(r.total) || 0, items_count: r.items_count || (r.receipt_items || []).length,
        vat_amount: Number(r.vat_amount) || 0,
      }));
      this.rows = [];
      data.forEach((r) => {
        (r.receipt_items || []).forEach((i) => {
          this.rows.push({
            receipt_id: r.id, date: String(r.purchased_at || "").slice(0, 10),
            month: String(r.purchased_at || "").slice(0, 7),
            merchant_slug: r.merchant_slug, merchant_name: r.merchant_name,
            line: i.line, barcode: i.barcode, name: i.name || "", name_en: i.name_en || "",
            category: i.category || "other", quantity: Number(i.quantity) || 0, unit: i.unit,
            unit_price: Number(i.unit_price) || 0, total: Number(i.total) || 0,
            product_key: i.product_key, base_price: Number(i.base_price) || 0,
            base_qty: Number(i.base_qty) || 0, base_unit: i.base_unit || "each",
            confidence: i.confidence == null ? null : Number(i.confidence),
          });
        });
      });
    },

    /** Scan through the server, which holds the key and counts the quota. */
    async scan(files) {
      const form = new FormData();
      [].concat(files).forEach((f, i) => form.append("images", f, (f.name || "receipt") + "-" + (i + 1) + ".jpg"));
      const out = await this.api("/scan", { method: "POST", body: form });
      if (this.account) { this.account.scans_used = out.scans_used; this.account.scans_limit = out.scans_limit; }
      return out;
    },

    async init() {
      if (!this.on()) return;
      const saved = store.get("session", null);
      if (saved && saved.access_token) { this.session = saved; await this.refresh(); }
      if (this.signedIn()) await this.load().catch(() => {});
    },
  };

  /* ========================= the working set ========================= */
  const allRows = () => DATA.rows.concat(...Receipts.items.map(flattenReceipt)).concat(Cloud.rows);
  const allReceipts = () => DATA.receipts.concat(Receipts.items.map(receiptCard)).concat(Cloud.cards)
    .sort((a, b) => b.date.localeCompare(a.date));

  const STORE_SLOTS = {};
  function assignStoreColours() {
    [...new Set(allRows().map((r) => r.merchant_slug))].sort().forEach((s) => {
      if (!STORE_SLOTS[s]) STORE_SLOTS[s] = "--store-" + ((Object.keys(STORE_SLOTS).length % 3) + 1);
    });
  }
  const storeColor = (s) => css(STORE_SLOTS[s] || "--store-1") || "#0b7a5e";
  const storeName = (s) => { const r = allRows().find((x) => x.merchant_slug === s); return r ? r.merchant_name : s; };

  /* ========================= filtering ========================= */
  function periodStart() {
    if (state.period === "all") return "0000-00-00";
    const months = Number(state.period), cards = allReceipts();
    const last = cards.length ? new Date(cards[0].date) : new Date();
    return new Date(last.getFullYear(), last.getMonth() - months + 1, 1).toISOString().slice(0, 10);
  }
  function visibleRows() {
    const from = periodStart(), q = state.q.trim().toLowerCase();
    return allRows().filter((r) =>
      r.date >= from &&
      (state.store === "all" || r.merchant_slug === state.store) &&
      (state.cat === "all" || r.category === state.cat) &&
      (!q || r.name.toLowerCase().includes(q) || (r.name_en || "").toLowerCase().includes(q) || String(r.barcode || "").includes(q)));
  }
  function visibleReceipts(rows) {
    const ids = new Set(rows.map((r) => r.receipt_id));
    return allReceipts().filter((r) => ids.has(r.receipt_id));
  }

  /* ========================= price intelligence ========================= */
  function priceBook(rows) {
    const book = new Map();
    rows.forEach((r) => {
      if (!book.has(r.product_key)) {
        book.set(r.product_key, { key: r.product_key, name: r.name, name_en: r.name_en, unit: r.base_unit, category: r.category, stores: new Map(), history: [] });
      }
      const p = book.get(r.product_key);
      p.history.push(r);
      const prev = p.stores.get(r.merchant_slug);
      if (!prev || r.date > prev.date) p.stores.set(r.merchant_slug, { date: r.date, price: r.base_price });
    });
    book.forEach((p) => p.history.sort((a, b) => a.date.localeCompare(b.date)));
    return book;
  }
  function overpay(rows, book) {
    let lost = 0;
    const per = new Map();
    rows.forEach((r) => {
      const p = book.get(r.product_key);
      if (!p || p.stores.size < 2) return;
      let best = null;
      p.stores.forEach((v, slug) => { if (!best || v.price < best.price) best = { price: v.price, slug: slug }; });
      if (!best || best.slug === r.merchant_slug) return;
      const diff = (r.base_price - best.price) * r.base_qty;
      if (diff <= 0.01) return;
      lost += diff;
      per.set(r.product_key, (per.get(r.product_key) || 0) + diff);
    });
    return { lost: lost, per: per };
  }
  // Matched-model index: every price is compared with the FIRST price of the same
  // product at the same store, so a pricier store entering the data never reads as inflation.
  function basketIndex(rows) {
    const months = [...new Set(rows.map((r) => r.month))].sort();
    if (months.length < 2) return [];
    const tracked = [];
    groupBy(rows, (r) => r.product_key + "@" + r.merchant_slug).forEach((rs) => {
      const sorted = [...rs].sort((a, b) => a.date.localeCompare(b.date));
      const byMonth = new Map();
      sorted.forEach((r) => byMonth.set(r.month, r.base_price));
      if (byMonth.size < 2 || !sorted[0].base_price) return;
      tracked.push({ byMonth: byMonth, base: sorted[0].base_price, weight: sum(sorted, (r) => r.total) / sorted.length });
    });
    if (!tracked.length) return [];
    const raw = [];
    months.forEach((m) => {
      let num = 0, den = 0, fresh = 0;
      tracked.forEach((tr) => {
        let rel = null, seen = false;
        tr.byMonth.forEach((price, mm) => { if (mm <= m) { rel = price / tr.base; if (mm === m) seen = true; } });
        if (rel === null) return;
        num += rel * tr.weight; den += tr.weight; if (seen) fresh += 1;
      });
      if (den) raw.push({ month: m, value: num / den, covered: fresh, total: tracked.length });
    });
    if (raw.length < 2) return [];
    const base = raw[0].value || 1;
    return raw.map((p) => ({ month: p.month, value: (p.value / base) * 100, covered: p.covered, total: p.total }));
  }
  function storeLevels(rows, book) {
    const stores = [...new Set(rows.map((r) => r.merchant_slug))];
    if (stores.length < 2) return [];
    const shared = [];
    book.forEach((p) => { if (p.stores.size >= 2) shared.push(p); });
    if (!shared.length) return [];
    return stores.map((slug) => {
      let cost = 0, ref = 0, n = 0;
      shared.forEach((p) => {
        const here = p.stores.get(slug);
        if (!here) return;
        let best = Infinity;
        p.stores.forEach((v) => { best = Math.min(best, v.price); });
        cost += here.price; ref += best; n += 1;
      });
      return { slug: slug, name: storeName(slug), n: n, value: ref ? (cost / ref) * 100 : null };
    }).filter((s) => s.n >= 2 && s.value).sort((a, b) => a.value - b.value);
  }
  function spreadOf(p) {
    let best = Infinity, worst = 0;
    p.stores.forEach((v) => { best = Math.min(best, v.price); worst = Math.max(worst, v.price); });
    return best ? (worst - best) / best : 0;
  }

  /* ========================= tooltip ========================= */
  const tip = $("tip");
  function bindTip(root) {
    root.querySelectorAll("[data-tip]").forEach((el) => {
      el.addEventListener("mouseenter", (e) => { tip.innerHTML = el.getAttribute("data-tip"); tip.style.opacity = "1"; move(e); });
      el.addEventListener("mousemove", move);
      el.addEventListener("mouseleave", () => { tip.style.opacity = "0"; });
    });
    function move(e) {
      const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + w > innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > innerHeight - 8) y = e.clientY - h - pad;
      tip.style.left = Math.max(8, x) + "px";
      tip.style.top = Math.max(8, y) + "px";
    }
  }

  /* ========================= charts ========================= */
  function niceMax(v) {
    if (v <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / (mag / 2)) * (mag / 2);
  }
  const EMPTY_ICON = '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v17l-2.3-2-2.3 2-2.4-2-2.3 2-2.4-2L5 20z"/><path d="M9 8h6M9 12h6"/></svg></span>';
  function emptyState(el, title, detail, withCta) {
    el.innerHTML = '<div class="empty">' + EMPTY_ICON + "<strong>" + esc(title) + "</strong><span>" + esc(detail) + "</span>" +
      (withCta ? '<button type="button" class="btn btn-primary">' + esc(t("scan_cta")) + "</button>" : "") + "</div>";
    if (withCta) { const b = el.querySelector("button"); if (b) b.onclick = () => setTab("scan"); }
  }
  // Time runs left-to-right in both languages; only the category and store bars mirror.
  function columnChart(el, data, label) {
    const W = Math.max(el.clientWidth || 320, 260), H = 200;
    const padL = 6, padR = 6, padT = 26, padB = 24;
    const inner = W - padL - padR, plotH = H - padT - padB;
    const max = niceMax(Math.max(...data.map((d) => d.value)));
    const step = inner / data.length, bw = Math.min(44, step * 0.6);
    const ink = css("--ink-2"), muted = css("--muted"), line = css("--hairline-2"), mark = css("--accent-mark");
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" direction="ltr" role="img" aria-label="' + esc(label) + '">';
    for (let i = 0; i <= 2; i++) {
      const y = padT + (plotH * i) / 2;
      s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="' + line + '" stroke-width="1"/>';
    }
    data.forEach((d, i) => {
      const h = Math.max(3, (d.value / max) * plotH);
      const x = padL + i * step + (step - bw) / 2, y = padT + plotH - h;
      s += '<rect class="mark" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="5" fill="' + mark + '" data-tip="' + esc(d.tip) + '"/>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (y - 7) + '" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="' + ink + '">' + esc(d.valueLabel) + "</text>";
      s += '<text x="' + (x + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="11" fill="' + muted + '">' + esc(d.label) + "</text>";
    });
    el.innerHTML = s + "</svg>";
    bindTip(el);
  }
  function barChart(el, data, label) {
    const W = Math.max(el.clientWidth || 320, 260), rtl = L().dir === "rtl";
    const rowH = 30, gap = 6, padT = 2, H = padT + data.length * (rowH + gap);
    const labelW = Math.min(148, Math.max(90, W * 0.36)), valueW = 70;
    const track = Math.max(40, W - labelW - valueW - 10);
    const max = Math.max(...data.map((d) => d.value)) || 1;
    const ink = css("--ink"), ink2 = css("--ink-2"), mark = css("--accent-mark");
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" direction="ltr" role="img" aria-label="' + esc(label) + '">';
    data.forEach((d, i) => {
      const y = padT + i * (rowH + gap), w = Math.max(3, (d.value / max) * track);
      const barX = rtl ? W - labelW - w : labelW;
      const labelX = rtl ? W : 0, valueX = rtl ? barX - 8 : barX + w + 8;
      const anchor = rtl ? "end" : "start";
      s += '<text x="' + labelX + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="' + anchor + '" font-size="12.5" fill="' + ink2 + '">' + esc(d.label) + "</text>";
      s += '<rect class="mark" x="' + barX + '" y="' + (y + 5) + '" width="' + w + '" height="' + (rowH - 10) + '" rx="5" fill="' + (d.color || mark) + '" data-tip="' + esc(d.tip) + '"/>';
      s += '<text x="' + valueX + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="' + anchor + '" font-size="12" font-family="IBM Plex Mono, monospace" fill="' + ink + '">' + esc(d.valueLabel) + "</text>";
    });
    el.innerHTML = s + "</svg>";
    bindTip(el);
  }
  function lineChart(el, points, label) {
    const W = Math.max(el.clientWidth || 320, 260), H = 200;
    const padL = 40, padR = 16, padT = 20, padB = 24;
    const inner = W - padL - padR, plotH = H - padT - padB;
    const values = points.map((p) => p.value);
    const lo = Math.min(...values, 100), hi = Math.max(...values, 100);
    const span = Math.max(hi - lo, 4), min = lo - span * 0.25, max = hi + span * 0.25;
    const x = (i) => padL + (points.length === 1 ? inner / 2 : (inner * i) / (points.length - 1));
    const y = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;
    const accent = css("--accent-mark"), muted = css("--muted"), line = css("--hairline-2"), surface = css("--surface");
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" direction="ltr" role="img" aria-label="' + esc(label) + '">';
    [min, (min + max) / 2, max].forEach((v) => {
      s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + line + '" stroke-width="1"/>';
      s += '<text x="' + (padL - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="' + muted + '">' + v.toFixed(1) + "</text>";
    });
    s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(100) + '" y2="' + y(100) + '" stroke="' + muted + '" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>';
    s += '<text x="' + (W - padR) + '" y="' + (y(100) - 5) + '" text-anchor="end" font-size="10" fill="' + muted + '">100</text>';
    const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.value).toFixed(1)).join(" ");
    s += '<path d="' + d + " L" + x(points.length - 1).toFixed(1) + " " + (padT + plotH) + " L" + x(0).toFixed(1) + " " + (padT + plotH) +
         ' Z" fill="' + accent + '" opacity="0.09"/>';
    s += '<path d="' + d + '" fill="none" stroke="' + accent + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    points.forEach((p, i) => {
      const last = i === points.length - 1;
      s += '<circle class="mark" cx="' + x(i) + '" cy="' + y(p.value) + '" r="' + (last ? 5.5 : 4) + '" fill="' + (last ? accent : surface) +
           '" stroke="' + accent + '" stroke-width="2" data-tip="' + esc(p.tip) + '"/>';
      s += '<text x="' + x(i) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="11" fill="' + muted + '">' + esc(p.label) + "</text>";
    });
    const lastP = points[points.length - 1];
    s += '<text x="' + x(points.length - 1) + '" y="' + (y(lastP.value) - 12) + '" text-anchor="end" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace" fill="' + accent + '">' + lastP.value.toFixed(1) + "</text>";
    el.innerHTML = s + "</svg>";
    bindTip(el);
  }

  /* ========================= dashboard ========================= */
  function statTile(label, value, note) {
    return '<div class="stat"><div class="eyebrow">' + esc(label) + '</div><div class="v">' + esc(value) + '</div><div class="n">' + esc(note) + "</div></div>";
  }
  function renderDash() {
    const rows = visibleRows(), receipts = visibleReceipts(rows), book = priceBook(rows);
    const spend = sum(rows, (r) => r.total), over = overpay(rows, book);
    const stores = new Set(rows.map((r) => r.merchant_slug));
    const flagged = rows.filter((r) => r.confidence != null && r.confidence < 0.8);

    $("range-tick").textContent = receipts.length
      ? (receipts.length > 1 ? receipts[receipts.length - 1].date + " → " + receipts[0].date : receipts[0].date)
      : t("no_receipts");

    $("hero-total").textContent = money(spend);
    $("hero-sub").textContent = t("hero_sub", { n: receipts.length, l: rows.length });
    const side = [
      { l: t("hero_avg"), v: money(receipts.length ? spend / receipts.length : 0) },
      { l: t("hero_vat"), v: money(sum(receipts, (r) => r.vat_amount || 0)) },
    ];
    if (over.lost > 0.5) side.push({ l: t("hero_over"), v: money(over.lost), warn: true });
    $("hero-side").innerHTML = side.map((s) =>
      '<div><span class="eyebrow">' + esc(s.l) + '</span><span class="v' + (s.warn ? " warn" : "") + '">' + esc(s.v) + "</span></div>").join("");

    const maxLine = rows.length ? rows.reduce((a, b) => (b.total > a.total ? b : a)) : null;
    const cats = [...groupBy(rows, (r) => r.category).entries()]
      .map(([c, rs]) => ({ c: c, v: sum(rs, (x) => x.total), n: rs.length })).sort((a, b) => b.v - a.v);
    $("stats").innerHTML = [
      statTile(t("st_items"), String(rows.length), t("st_items_n", { n: cats.length })),
      statTile(t("st_priciest"), maxLine ? money(maxLine.total) : "—",
        maxLine ? (state.lang === "he" ? maxLine.name : (maxLine.name_en || maxLine.name)) : "—"),
      statTile(t("st_stores"), String(stores.size), [...stores].map(storeName).join(", ") || "—"),
      statTile(t("st_flagged"), String(flagged.length),
        flagged.length ? t("st_flagged_n") : t("st_flagged_ok")),
    ].join("");

    // Categories: one accent hue — the axis labels carry identity, so no colour cycling.
    if (!cats.length) {
      emptyState($("c-cats"), t(rows.length || DATA.rows.length ? "e_range_t" : "first_t"),
        t(rows.length || DATA.rows.length ? "e_range_d" : "first_d"), !DATA.rows.length && !Receipts.items.length);
      $("cat-hint").textContent = "";
    } else {
      const top = cats.slice(0, 7), rest = cats.slice(7);
      if (rest.length) top.push({ c: "__other", v: sum(rest, (x) => x.v), n: sum(rest, (x) => x.n) });
      $("cat-hint").textContent = t("cats_n", { n: cats.length });
      barChart($("c-cats"), top.map((d) => ({
        label: d.c === "__other" ? t("other_cats", { n: rest.length }) : catLabel(d.c),
        value: d.v, valueLabel: money0(d.v),
        tip: "<div class='t-title'>" + esc(d.c === "__other" ? t("other_cats_t") : catLabel(d.c)) + "</div><div class='t-row'>" +
             money(d.v) + " · " + (spend ? ((d.v / spend) * 100).toFixed(1) : 0) + "% · " + d.n + "</div>",
      })), t("h_cats"));
    }

    const byMonth = [...groupBy(rows, (r) => r.month).entries()].sort((a, b) => a[0].localeCompare(b[0]));
    if (!byMonth.length) { emptyState($("c-months"), t("e_range_t"), t("e_range_d")); $("spend-hint").textContent = ""; }
    else {
      $("spend-hint").textContent = t("months_n", { n: byMonth.length });
      columnChart($("c-months"), byMonth.map(([m, rs]) => {
        const v = sum(rs, (r) => r.total);
        return { label: monthLabel(m), value: v, valueLabel: money0(v),
          tip: "<div class='t-title'>" + monthLabel(m) + "</div><div class='t-row'>" +
               esc(t("receipts_lines", { v: money(v), r: new Set(rs.map((r) => r.receipt_id)).size, l: rs.length })) + "</div>" };
      }), t("h_months"));
    }

    const idx = basketIndex(rows);
    if (idx.length < 2) emptyState($("c-index"), t("e_hist_t"), t("e_hist_d"));
    else {
      lineChart($("c-index"), idx.map((p) => ({
        label: monthLabel(p.month), value: p.value,
        tip: "<div class='t-title'>" + monthLabel(p.month) + "</div><div class='t-row'>" +
             esc(t("idx_vs", { v: p.value.toFixed(1), d: (p.value >= 100 ? "+" : "") + (p.value - 100).toFixed(1), m: monthLabel(idx[0].month) })) +
             "</div><div class='t-row'>" + esc(t("idx_covered", { c: p.covered, t: p.total })) + "</div>",
      })), t("h_index"));
    }

    const levels = storeLevels(rows, book);
    if (!levels.length) emptyState($("c-stores"), t("e_stores_t"), t("e_stores_d"));
    else {
      barChart($("c-stores"), levels.map((s) => ({
        label: s.name, value: s.value, valueLabel: s.value.toFixed(1), color: storeColor(s.slug),
        tip: "<div class='t-title'>" + esc(s.name) + "</div><div class='t-row'>" + esc(t("vs_cheapest", { v: s.value.toFixed(1) })) +
             "</div><div class='t-row'>" + esc(t("on_shared", { n: s.n })) + "</div>",
      })), t("h_stores"));
      $("c-stores").insertAdjacentHTML("beforeend", '<div class="legend">' + levels.map((s) =>
        '<span class="chip"><span class="dot" style="background:' + storeColor(s.slug) + '"></span>' + esc(s.name) + "</span>").join("") + "</div>");
    }

    renderCompare(book, over.per);
    renderMovers(rows);
    renderReceipts(receipts);
    renderLines(rows);
  }

  function renderCompare(book, perProduct) {
    const el = $("t-compare");
    const shared = [...book.values()].filter((p) => p.stores.size >= 2);
    $("cmp-hint").textContent = shared.length ? t("products_n", { n: shared.length }) : "";
    if (!shared.length) { emptyState(el, t("e_overlap_t"), t("e_overlap_d")); return; }
    const stores = [...new Set([].concat(...shared.map((p) => [...p.stores.keys()])))].sort();
    shared.sort((a, b) => (perProduct.get(b.key) || 0) - (perProduct.get(a.key) || 0) || spreadOf(b) - spreadOf(a));
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_product")) + "</th>" +
      stores.map((s) => '<th class="n"><span class="chip"><span class="dot" style="background:' + storeColor(s) + '"></span>' + esc(storeName(s)) + "</span></th>").join("") +
      '<th class="n">' + esc(t("col_spread")) + '</th><th class="n">' + esc(t("col_costing")) + "</th></tr></thead><tbody>";
    shared.slice(0, 18).forEach((p) => {
      let best = Infinity, worst = 0;
      p.stores.forEach((v) => { best = Math.min(best, v.price); worst = Math.max(worst, v.price); });
      const primary = state.lang === "he" ? p.name : (p.name_en || p.name);
      const secondary = state.lang === "he" ? (p.name_en || "") : (p.name !== primary ? p.name : "");
      h += "<tr><td class='name'><span dir='auto'>" + esc(primary) + "</span>" +
        (secondary ? "<br><span class='sec' dir='auto'>" + esc(secondary) + "</span>" : "") + "</td>";
      stores.forEach((s) => {
        const v = p.stores.get(s);
        h += '<td class="n">' + (v ? '<span class="' + (v.price === best ? "best" : "") + '">' + money(v.price) + baseUnit(p.unit) + "</span>" : '<span class="sec">—</span>') + "</td>";
      });
      h += '<td class="n">' + (best ? "+" + (((worst - best) / best) * 100).toFixed(0) + "%" : "—") + "</td>";
      const lost = perProduct.get(p.key) || 0;
      h += '<td class="n">' + (lost > 0.01 ? '<span class="delta-up">' + money(lost) + "</span>" : '<span class="sec">—</span>') + "</td></tr>";
    });
    el.innerHTML = h + "</tbody></table></div>";
  }

  function renderMovers(rows) {
    const el = $("t-movers"), movers = [];
    groupBy(rows, (r) => r.product_key + "@" + r.merchant_slug).forEach((rs) => {
      const sorted = [...rs].sort((a, b) => a.date.localeCompare(b.date));
      const first = sorted[0], last = sorted[sorted.length - 1];
      if (first.date === last.date || !first.base_price) return;
      const change = ((last.base_price - first.base_price) / first.base_price) * 100;
      if (Math.abs(change) >= 0.5) movers.push({ first: first, last: last, change: change });
    });
    if (!movers.length) { emptyState(el, t("e_repeat_t"), t("e_repeat_d")); return; }
    movers.sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_product")) + '</th><th class="n">' + esc(t("col_first")) +
      '</th><th class="n">' + esc(t("col_latest")) + '</th><th class="n">' + esc(t("col_change")) + "</th></tr></thead><tbody>";
    movers.slice(0, 10).forEach((m) => {
      const up = m.change > 0, u = baseUnit(m.first.base_unit);
      h += "<tr><td class='name'><span dir='auto'>" + esc(state.lang === "he" ? m.first.name : (m.first.name_en || m.first.name)) + "</span><br><span class='sec'>" +
        "<span dir='auto'>" + esc(m.first.merchant_name) + "</span> · " + esc(m.first.date) + " → " + esc(m.last.date) + "</span></td>" +
        '<td class="n">' + money(m.first.base_price) + u + '</td><td class="n">' + money(m.last.base_price) + u + "</td>" +
        '<td class="n ' + (up ? "delta-up" : "delta-down") + '">' + (up ? "▲" : "▼") + " " + pct(m.change) + "</td></tr>";
    });
    el.innerHTML = h + "</tbody></table></div>";
  }

  function renderReceipts(receipts) {

  const LINE_COLS = [
    { key: "date", label: "col_date" }, { key: "name", label: "col_item" },
    { key: "merchant_name", label: "col_store" }, { key: "category", label: "col_category" },

  /* ========================= scanning ========================= */
  const SCAN_PROMPT = [

  // Added when a receipt arrives as several photos or strips.
  const MULTI_NOTE = [
    "",
    "THESE PHOTOS ARE ONE RECEIPT, in order from its top to its bottom. Consecutive photos",
    "OVERLAP, so some lines appear twice — list every purchased line exactly ONCE, in the order",
    "they are printed. Do not restart the line numbering per photo.",
    "The receipt prints how many items it has and what the total is: read both from the last",

  ].join("\n");

  let scanFile = null, scanFiles = [], scanReceipt = null, scanCtl = null, scanStoredRemotely = false;

  /* A long receipt is the hard case. Every photo is downsized to about 1.2
     megapixels before the model sees it, so a metre of paper in one frame
     leaves a couple of pixels per letter. Slicing the photo into overlapping
     strips keeps each strip's letters big enough to read, because each strip
     gets its own 1.2 megapixels. */
  async function sliceTall(file, maxParts) {
    if (typeof createImageBitmap !== "function" || maxParts < 2) return [file];
    let bmp;
    try {
      // Decoding a 12-megapixel photo is slow on a weak phone and can hang on
      // some builds; sending the original whole is better than never finishing.
      bmp = await Promise.race([
        createImageBitmap(file),
        new Promise((_, reject) => setTimeout(() => reject(new Error("decode timed out")), 20000)),
      ]);
    } catch (e) { return [file]; }
    const ratio = bmp.height / bmp.width;
    if (ratio < 2.2) { bmp.close && bmp.close(); return [file]; }

    const parts = Math.min(maxParts, Math.max(2, Math.ceil(ratio / 1.5)));
    const step = bmp.height / parts, overlap = step * 0.14;   // the overlap stops a line falling between two strips
    const out = [];
    for (let i = 0; i < parts; i++) {
      const top = Math.max(0, i * step - overlap);
      const bottom = Math.min(bmp.height, (i + 1) * step + overlap);
      const canvas = document.createElement("canvas");
      canvas.width = bmp.width;
      canvas.height = Math.round(bottom - top);
      canvas.getContext("2d").drawImage(bmp, 0, top, bmp.width, canvas.height, 0, 0, bmp.width, canvas.height);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.92));
      if (blob) out.push(blob);
    }
    bmp.close && bmp.close();
    return out.length >= 2 ? out : [file];
  }

  function status(el, text, busy) {
    el.innerHTML = (busy ? '<span class="spinner"></span>' : "") + (text ? "<span>" + esc(text) + "</span>" : "");
  }
  /* Photos accumulate. A long receipt takes two or three shots, and each one
     must join the others rather than replace them. Nothing is sent to Claude
     until the person says they are done. */
  function pickFile(files) {
    const list = [].concat(files || []).filter((f) => f && /^image\//.test(f.type || ""));
    if (!list.length) return;
    const room = Math.max(0, (Cloud.signedIn() ? 8 : AI.maxImages()) - scanFiles.length);
    scanFiles = scanFiles.concat(list.slice(0, room));
    scanFile = scanFiles[0];
    scanReceipt = null;
    $("scan-stage").hidden = true;
    renderShots();
  }
  function renderShots() {
    const box = $("shots"), row = $("shots-row");
    box.hidden = !scanFiles.length;
    if (!scanFiles.length) { row.innerHTML = ""; return; }
    row.innerHTML = scanFiles.map((f, i) =>
      '<div class="shot"><img alt="" src="' + URL.createObjectURL(f) + '">' +
      '<span class="n">' + (i + 1) + '</span>' +
      '<button type="button" class="x" data-drop="' + i + '" aria-label="remove">×</button></div>').join("");
    row.querySelectorAll("[data-drop]").forEach((b) => {
      b.onclick = () => { scanFiles.splice(Number(b.dataset.drop), 1); scanFile = scanFiles[0] || null; renderShots(); };
    });
    $("do-scan").textContent = scanFiles.length === 1 ? t("shots_scan_one") : t("shots_scan", { n: scanFiles.length });
    $("add-shot").textContent = t("shots_add");
    $("clear-shots").textContent = t("shots_clear");
    $("shots-hint").textContent = scanFiles.length > 1 ? t("shots_hint_many") : t("shots_hint_one");
  }

  /** One long photo becomes strips; several photos are already the strips. */
  async function scanParts() {
    const cap = Cloud.signedIn() ? 8 : AI.maxImages();
    if (scanFiles.length > 1) return scanFiles.slice(0, cap);
    return sliceTall(scanFiles[0], cap);
  }
  async function runScan() {
    if (!scanFiles.length) return;
    if (!Cloud.signedIn() && AI.imageMode() === "none") {
      // Nothing to send it to — but the attempt was allowed, so answer it.
      $("scan-stage").hidden = false;
      $("scan-img").src = URL.createObjectURL(scanFiles[0]);
      status($("scan-status"), "", false);
      $("scan-result").innerHTML = '<div class="notice notice-warn">' +
        esc(t(!!AI.sample && !AI.imageLimits ? "noimg_d" : "blocked_d")) + "</div>";
      $("scan-actions").innerHTML = "";
      return;
    }
    $("scan-stage").hidden = false;
    $("scan-img").src = URL.createObjectURL(scanFiles[0]);
    $("scan-result").innerHTML = "";
    $("scan-stage").scrollIntoView({ block: "nearest", behavior: "smooth" });
    const statusEl = $("scan-status");
    status(statusEl, t("preparing"), true);
    let parts;
    try {
      parts = await scanParts();
    } catch (e) {
      parts = scanFiles;
    }
    const prompt = parts.length > 1 ? SCAN_PROMPT + MULTI_NOTE : SCAN_PROMPT;
    status(statusEl, parts.length > 1 ? t("scanning_parts", { n: parts.length }) : t("scanning"), true);
    $("scan-actions").innerHTML = '<button type="button" class="btn" id="scan-stop">' + esc(t("scan_stop")) + "</button>";
    scanCtl = new AbortController();
    $("scan-stop").onclick = () => scanCtl.abort();
    scanStoredRemotely = false;
    try {
      if (Cloud.signedIn()) {
        const out = await Cloud.scan(parts);
        scanReceipt = normaliseScan(out.receipt);
        scanStoredRemotely = true;
        showScanResult();
        await Cloud.load().catch(() => {});
        paintAccount();
        renderCurrent();
        return;
      }
      const parsed = await AI.readImages(prompt, parts, { signal: scanCtl.signal });
      scanReceipt = normaliseScan(parsed);
      showScanResult();
    } catch (e) {
      if (e && e.code === "cancelled") { status(statusEl, "", false); $("scan-actions").innerHTML = ""; return; }
      if (e && (e.status === 402 || e.error === "quota_exhausted")) {
        status(statusEl, "", false);
        $("scan-result").innerHTML = '<div class="notice notice-warn"><strong>' + esc(t("quota_out_t")) + "</strong><br>" + esc(t("quota_out_d")) + "</div>";
        $("scan-actions").innerHTML = e.checkout_url
          ? '<button type="button" class="btn btn-primary" id="do-upgrade">' + esc(t("acc_upgrade")) + "</button>" : "";
        const up = $("do-upgrade");
        if (up) up.onclick = () => open(e.checkout_url, "_blank", "noopener");
        return;
      }
      status(statusEl, "", false);
      const imageless = e && (e.code === "images_unavailable" || /image input is not available/i.test(String(e.message || "")));
      $("scan-result").innerHTML = '<div class="notice notice-bad">' +
        esc(imageless ? t("noimg_confirmed") : t("scan_failed", { m: (e && (e.message || e.code)) || "error" })) + "</div>";
      $("scan-actions").innerHTML = "";
      if (imageless) paintEngine();
    }
  }
  function normaliseScan(p) {
    const r = Object.assign({ schema_version: "1.0" }, p);
    r.items = (r.items || []).map((i, n) => Object.assign({ line: n + 1 }, i));
    const date = String(r.purchased_at || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
    const mslug = slug((r.merchant || {}).slug || (r.merchant || {}).name_en || (r.merchant || {}).name || "shop")
      .replace(/[^a-z0-9-]/g, "") || "shop";
    if (!r.merchant) r.merchant = { name: "Unknown", slug: mslug };
    r.merchant.slug = mslug;
    const doc = String(((r.document || {}).number) || Date.now()).replace(/[^A-Za-z0-9-]/g, "") || String(Date.now());
    r.receipt_id = date + "_" + mslug + "_" + doc;
    r.scanned_at = new Date().toISOString().slice(0, 19);
    return r;
  }
  function showScanResult() {
    const r = scanReceipt, problems = checkReceipt(r), totals = r.totals || {};
    status($("scan-status"), "", false);
    let h = "<div class='notice " + (problems.length ? "notice-warn" : "notice-good") + "'>" +
      esc(problems.length ? t("scan_checks_bad", { m: problems.join("; ") }) : t("scan_checks_ok")) + "</div>";
    h += "<div style='font-size:13.5px; margin-bottom:8px'><strong dir='auto'>" + esc((r.merchant || {}).name || "") + "</strong> · " +
      esc((r.purchased_at || "").replace("T", " ")) + " · <span class='num'>" + money(Number(totals.total) || 0) + "</span></div>";
    h += "<div class='scroll' style='max-height:300px; overflow-y:auto'><table><tbody>";
    (r.items || []).forEach((i) => {
      const low = i.confidence != null && i.confidence < 0.8;
      h += "<tr" + (low ? " class='flagrow'" : "") + "><td class='name'><span dir='auto'>" + esc(i.name) + "</span>" +
        (i.name_en ? " <span class='sec'>" + esc(i.name_en) + "</span>" : "") + "</td>" +
        "<td class='n sec'>" + esc(i.quantity) + (i.unit === "kg" ? " kg" : "") + " × " + money(Number(i.unit_price) || 0) + "</td>" +
        "<td class='n'>" + money(Number(i.total) || 0) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    if (Receipts.has(r.receipt_id)) h += "<div class='notice notice-warn'>" + esc(t("scan_dup")) + "</div>";
    $("scan-result").innerHTML = h;

    if (scanStoredRemotely) {
      $("scan-result").insertAdjacentHTML("afterbegin", '<div class="notice notice-good">' + esc(t("scan_saved")) + "</div>");
      $("scan-actions").innerHTML = '<button type="button" class="btn btn-primary" id="do-again3">' + esc(t("scan_again")) + "</button>";
      $("do-again3").onclick = resetScan;
      return;
    }
    const actions = ['<button type="button" class="btn btn-primary" id="do-save">' + esc(t("scan_save")) + "</button>"];
    if (Receipts.downloads) actions.push('<button type="button" class="btn" id="do-download">' + esc(t("scan_download")) + "</button>");
    actions.push('<button type="button" class="btn" id="do-again">' + esc(t("scan_again")) + "</button>");
    $("scan-actions").innerHTML = actions.join("");
    $("do-save").onclick = saveScan;
    const dl = $("do-download");
    if (dl) dl.onclick = () => Receipts.downloads.save({ filename: r.receipt_id + ".json", data: JSON.stringify(r, null, 2) }).catch(() => {});
    $("do-again").onclick = resetScan;
  }
  function resetScan() {

  async function saveScan() {
    const r = scanReceipt, btn = $("do-save");
    btn.disabled = true;
    status($("scan-status"), t("scan_saving"), true);
    try {
      if (Receipts.assets && scanFile) {
        const up = await Receipts.assets.upload(scanFile).catch(() => null);
        if (up) { r.source_image = up.url; r.image_id = up.id; }
      }
      await Receipts.save(r);
      status($("scan-status"), t("scan_saved"), false);
      $("scan-actions").innerHTML = '<button type="button" class="btn btn-primary" id="do-again2">' + esc(t("scan_again")) + "</button>";

  function renderSaved() {
    const el = $("t-saved"), items = Receipts.items;
    $("saved-hint").textContent = items.length ? t("in_view", { n: items.length }) : "";
    if (!items.length) { emptyState(el, t("saved_none_t"), t("saved_none_d")); return; }
    let h = '<div class="scroll"><table><thead><tr><th>' + esc(t("col_date")) + "</th><th>" + esc(t("col_store")) +
      '</th><th class="n">' + esc(t("col_items")) + '</th><th class="n">' + esc(t("col_total")) + "</th><th></th></tr></thead><tbody>";
    [...items].sort((a, b) => String(b.purchased_at).localeCompare(String(a.purchased_at))).forEach((r) => {

  /* ========================= ask ========================= */
  function askContext() {
    const rows = allRows(), receipts = allReceipts(), book = priceBook(rows);
    const lines = ["DATA SUMMARY (currency ILS, all amounts in shekels)"];
    lines.push("Receipts: " + receipts.length + ", " + rows.length + " line items, total spend " + sum(rows, (r) => r.total).toFixed(2));
    const months = [...groupBy(rows, (r) => r.month).entries()].sort((a, b) => a[0].localeCompare(b[0]));
    lines.push("By month: " + months.map(([m, rs]) => m + "=" + sum(rs, (r) => r.total).toFixed(0)).join(", "));
    const bycat = [...groupBy(rows, (r) => r.category).entries()].sort((a, b) => sum(b[1], (r) => r.total) - sum(a[1], (r) => r.total));
    lines.push("By category: " + bycat.map(([c, rs]) => c + "=" + sum(rs, (r) => r.total).toFixed(0)).join(", "));
    lines.push("By store: " + [...groupBy(rows, (r) => r.merchant_slug).entries()]
      .map(([s, rs]) => storeName(s) + "=" + sum(rs, (r) => r.total).toFixed(0)).join(", "));
    const levels = storeLevels(rows, book);
    if (levels.length) lines.push("Store price level, 100 = cheapest on shared products: " + levels.map((s) => s.name + "=" + s.value.toFixed(1)).join(", "));
    const idx = basketIndex(rows);
    if (idx.length > 1) lines.push("Basket price index (100 = " + idx[0].month + "): " + idx.map((p) => p.month + "=" + p.value.toFixed(1)).join(", "));
    lines.push("");
    lines.push("LINE ITEMS (date | name | english | category | qty unit | paid | normalised price):");
    [...rows].sort((a, b) => b.total - a.total).slice(0, 120).forEach((r) => {
      lines.push("- " + r.date + " | " + r.name + " | " + (r.name_en || "") + " | " + r.category + " | " +
        r.quantity + " " + r.unit + " | " + r.total.toFixed(2) + " | " + r.base_price.toFixed(2) + "/" + r.base_unit +
        " | " + r.merchant_name);
    });
    return lines.join("\n").slice(0, 22000);
  }
  function askRules() {
    return [
      "You are the assistant inside a grocery-spending app called Basket Watch. Answer questions about the",
      "shopping data below.",
      state.lang === "he" ? "Answer in Hebrew." : "Answer in English.",
      "Rules: use only the data given — never invent a number. Amounts are shekels (₪). Prices per kg/litre/item",
      "are already normalised, so they are comparable across stores and pack sizes. Be brief: a couple of",
      "sentences or a short list, with the numbers that back it up. If the data cannot answer the question, say",
      "what is missing and what to scan to get it.",
      "",
      askContext(),
    ].join("\n");
  }
  let askTurns = [], askCtl = null;
  function bubble(who, text, cls) {
    const d = document.createElement("div");
    d.className = "bubble " + cls;
    d.innerHTML = "<div class='who'>" + esc(who) + "</div><div class='body'></div>";
    d.querySelector(".body").textContent = text;
    $("ask-thread").appendChild(d);
    d.scrollIntoView({ block: "nearest" });
    return d.querySelector(".body");
  }
  async function ask(question) {
    if (!question.trim() || AI.mode === "none") return;
    $("ask-input").value = "";
    bubble(t("you"), question, "me");
    const out = bubble(t("claude"), t("ask_thinking"), "ai");
    askTurns.push({ role: "user", content: question });
    $("ask-send").disabled = true;
    $("ask-stop").hidden = false;
    askCtl = new AbortController();
    try {
      const text = await AI.askText([{ role: "user", content: askRules() }].concat(askTurns), {
        signal: askCtl.signal,
        onText: (u) => { out.textContent = u.text; },
      });
      out.textContent = text;
      askTurns.push({ role: "assistant", content: text });
      if (askTurns.length > 8) askTurns = askTurns.slice(-8);
    } catch (e) {
      if (e && e.code === "cancelled") out.textContent = e.text || "";
      else out.textContent = (e && e.text) || t("ask_failed", { m: (e && (e.message || e.code)) || "error" });
      askTurns.pop();
    } finally {
      $("ask-send").disabled = false;
      $("ask-stop").hidden = true;
      askCtl = null;
    }
  }

  /** Show which route to Claude is live, and unlock or explain the two screens. */
