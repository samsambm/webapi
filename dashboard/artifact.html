    $("key-state").textContent = AI.embedded() ? t("key_embedded") : AI.hasKey() ? t("key_set") : t("key_none");
    if (AI.imageLimits && AI.imageLimits.mediaTypes) {
      $("file").accept = AI.imageLimits.mediaTypes.join(",");
    }
  }
  /** Show the account block only when this build has a server to talk to. */
  function paintAccount() {
    const box = $("account");
    box.hidden = !Cloud.on();
    if (!Cloud.on()) return;
    const inn = Cloud.signedIn();
    $("account-in").hidden = !inn;
    $("account-out").hidden = inn;
    // Google refuses OAuth inside an embedded WebView, so the button only shows
    // where it can actually work.
    const inApp = !!window.BasketWatchNative;
    $("acc-google").hidden = inApp;
    $("acc-note").textContent = inApp ? t("acc_note_webview") : t("acc_note");
    if (!inn) return;

    const a = Cloud.account || {};
    $("acc-who").textContent = a.email || "";
    $("acc-plan").textContent = a.plan === "pro" ? t("plan_pro") : t("plan_free");
    $("acc-renews").textContent = a.plan_renews_at ? t("acc_renews", { d: String(a.plan_renews_at).slice(0, 10) }) : "";
    const used = a.scans_used == null ? "—" : String(a.scans_used);
    $("acc-quota").textContent = used;
    $("acc-quota-note").textContent = a.plan === "pro" ? t("acc_quota_unlimited") : t("acc_quota_note", { n: a.scans_limit || 0 });
    const upgrade = $("acc-upgrade");
    upgrade.hidden = !(a.plan !== "pro" && a.checkout_url);
    upgrade.onclick = () => { if (a.checkout_url) open(a.checkout_url, "_blank", "noopener"); };
  }

  function setTab(tab) {
    state.tab = ["dash", "scan", "ask"].includes(tab) ? tab : "dash";
    store.set("tab", state.tab);
    ["dash", "scan", "ask"].forEach((n) => { $("view-" + n).hidden = n !== state.tab; });
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    scrollTo({ top: 0, behavior: "instant" });
    renderCurrent();
  }
  function renderCurrent() {
    assignStoreColours();
    if (state.tab === "dash") renderDash();
    else if (state.tab === "scan") renderSaved();
  }

  function wire() {
    $("lang-he").onclick = () => { state.lang = "he"; store.set("lang", "he"); fmtCache.clear(); applyLang(); renderCurrent(); };
    $("lang-en").onclick = () => { state.lang = "en"; store.set("lang", "en"); fmtCache.clear(); applyLang(); renderCurrent(); };
    $("f-currency").onchange = (e) => {
      state.currency = e.target.value; store.set("currency", state.currency);
      fmtCache.clear(); fillControls(); renderCurrent();
    };
    $("f-rate").oninput = (e) => {
      const v = Number(e.target.value);
      state.rate = v > 0 ? v : null; store.set("rate", state.rate); renderCurrent();
    };
    document.querySelectorAll("[data-tab]").forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });
    $("f-period").onchange = (e) => { state.period = e.target.value; renderCurrent(); };
    $("f-store").onchange = (e) => { state.store = e.target.value; renderCurrent(); };
    $("f-cat").onchange = (e) => { state.cat = e.target.value; renderCurrent(); };
    let qt;
    $("f-q").oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; renderCurrent(); }, 140); };

    $("do-scan").onclick = () => runScan();
    $("clear-shots").onclick = resetScan;
    // take / pick / add-shot are <label for="…"> — the browser opens the picker
    // itself, which works where a scripted .click() on the input does not.
    const took = (e) => {
      pickFile([...(e.target.files || [])]);
      e.target.value = "";          // so the same file can be chosen twice in a row
    };
    $("file").onchange = took;
    $("file-camera").onchange = took;
    const drop = $("drop");
    ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => {
      pickFile([...((e.dataTransfer && e.dataTransfer.files) || [])]);
    });

    $("key-save").onclick = () => {
      const v = $("apikey").value.trim();
      if (v && !/^sk-ant-/.test(v)) { $("key-state").textContent = t("key_bad"); return; }
      store.set("apikey", v);
      $("apikey").value = "";
      paintEngine();
    };
    $("key-clear").onclick = () => { store.del("apikey"); $("apikey").value = ""; paintEngine(); };

    const accError = (e) => {
      $("acc-error").innerHTML = e ? '<div class="notice notice-bad">' +
        esc(t("acc_failed", { m: (e && (e.message || e.error || e.detail)) || "error" })) + "</div>" : "";
    };
    const accBusy = (on) => { ["acc-signin", "acc-signup", "acc-google"].forEach((id) => { $(id).disabled = on; }); };
    $("acc-signin").onclick = async () => {
      accError(null); accBusy(true);
      try {
        await Cloud.signIn($("acc-email").value.trim(), $("acc-pass").value);
        $("acc-pass").value = "";
        paintAccount(); paintEngine(); fillControls(); renderCurrent();
      } catch (e) { accError(e); } finally { accBusy(false); }
    };
    $("acc-signup").onclick = async () => {
      accError(null); accBusy(true);
      try {
        const out = await Cloud.signUp($("acc-email").value.trim(), $("acc-pass").value);
        $("acc-pass").value = "";
        if (!out.confirmed) {
          $("acc-error").innerHTML = '<div class="notice notice-good">' + esc($("acc-email").value.trim()) + " ✓</div>";
        }
        paintAccount(); paintEngine(); fillControls(); renderCurrent();
      } catch (e) { accError(e); } finally { accBusy(false); }
    };
    $("acc-google").onclick = () => { location.href = Cloud.googleUrl(); };
    $("acc-signout").onclick = () => {
      Cloud.signOut();
      paintAccount(); paintEngine(); fillControls(); renderCurrent();
    };

    $("ask-form").onsubmit = (e) => { e.preventDefault(); ask($("ask-input").value); };
    $("ask-input").onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask($("ask-input").value); }
    };
    $("ask-stop").onclick = () => { if (askCtl) askCtl.abort(); };

    let rt;
    addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderCurrent, 160); });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderCurrent);
  }

  wire();
  applyLang();
  setTab(store.get("tab", "dash"));
  AI.init().then(paintEngine);
  Receipts.init(() => { fillControls(); renderCurrent(); });
  Cloud.init().then(() => { paintAccount(); paintEngine(); fillControls(); renderCurrent(); });
})();
</script>
