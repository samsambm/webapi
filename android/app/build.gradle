plugins { id "com.android.application" }

android {
    namespace "com.basketwatch.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.basketwatch.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: the whole app is one WebView over the generated
// dashboard, so the APK stays small and has nothing to keep up to date.
