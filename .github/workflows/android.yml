name: Build APK

# The Android SDK is preinstalled on GitHub's Ubuntu runners, so the APK is
# built here rather than locally. Download it from the run's Artifacts section.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "dashboard/**"
      - "data/**"
      - "scripts/**"
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the dashboard from the receipt data
        run: python3 scripts/build_dashboard.py

      - name: Bundle the dashboard into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp dashboard/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk basket-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basket-watch-apk
          path: basket-watch.apk
          if-no-files-found: error
