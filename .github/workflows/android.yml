name: Build APK

# The Android SDK is preinstalled on GitHub's Ubuntu runners, so the APK is
# built here rather than locally. Download it from the run's Artifacts section.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "dashboard/**"
      - "data/**"
      - "scripts/**"
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the dashboard from the receipt data
        run: python3 scripts/build_dashboard.py

      - name: Bundle the dashboard into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp dashboard/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk basket-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basket-watch-apk
          path: basket-watch.apk
          if-no-files-found: error

      # Artifacts need a GitHub login and expire after 90 days. A release asset
      # is a plain public URL that stays put, so the download link never changes:
      # https://github.com/samsambm/webapi/releases/download/apk-latest/basket-watch.apk
      - name: Publish the APK as the latest release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest basket-watch.apk \
            --title "Basket Watch APK (latest build)" \
            --notes "Debug-signed APK built from ${GITHUB_SHA:0:7}.

          **Install:** download \`basket-watch.apk\`, tap it on your Android phone, and allow
          installs from whichever app opened it.

          Dashboard only — the Scan and Ask screens need the published artifact. Nothing in
          this APK calls an AI, so it costs nothing to run.

          Rebuilt on every push to the default branch." 
